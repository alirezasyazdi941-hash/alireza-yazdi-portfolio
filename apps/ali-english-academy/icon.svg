<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Outer subtle tech frame -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0e2238" stroke-width="1.5" stroke-dasharray="8 6"/>
  <!-- Glowing central shield / diamond -->
  <polygon points="256,76 416,216 416,336 256,436 96,336 96,216" fill="#071224" stroke="url(#neonRing)" stroke-width="4" filter="url(#glow)"/>
  <!-- Central AE typography and crest -->
  <path d="M190 320 L240 180 L272 180 L322 320 L292 320 L280 284 L232 284 L220 320 Z M240 258 L272 258 L256 210 Z" fill="url(#cyanGrad)"/>
  <!-- Tech crosshairs & accents -->
  <circle cx="256" cy="256" r="8" fill="#38bdf8"/>
  <circle cx="96" cy="216" r="4" fill="#06b6d4"/>
  <circle cx="416" cy="216" r="4" fill="#06b6d4"/>
  <circle cx="256" cy="76" r="5" fill="#38bdf8"/>
  <circle cx="256" cy="436" r="5" fill="#38bdf8"/>
  <line x1="256" y1="360" x2="256" y2="400" stroke="#38bdf8" stroke-width="2"/>
  <line x1="160" y1="360" x2="352" y2="360" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
