<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2"/>

  <!-- Geometric Grid & Circuit Lines -->
  <path d="M96 256 H416 M256 96 V416" stroke="rgba(59, 130, 246, 0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="2"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2"/>

  <!-- Outer Hexagon Hub -->
  <polygon points="256,120 374,188 374,324 256,392 138,324 138,188" 
           fill="rgba(15, 23, 42, 0.8)" 
           stroke="url(#cyan-glow)" 
           stroke-width="5" 
           filter="url(#glow)"/>

  <!-- Code Chevron Brackets & Data Stream Core -->
  <path d="M210 216 L170 256 L210 296" fill="none" stroke="#00f0ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M302 216 L342 256 L302 296" fill="none" stroke="#00f0ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M272 208 L240 304" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>

  <!-- Node Dots -->
  <circle cx="256" cy="120" r="7" fill="#00f0ff" />
  <circle cx="374" cy="188" r="7" fill="#3b82f6" />
  <circle cx="374" cy="324" r="7" fill="#8b5cf6" />
  <circle cx="256" cy="392" r="7" fill="#00f0ff" />
  <circle cx="138" cy="324" r="7" fill="#8b5cf6" />
  <circle cx="138" cy="188" r="7" fill="#3b82f6" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>
