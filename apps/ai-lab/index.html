<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alireza Yazdi · AI Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#141b34;--ink:#e8ecff;--mut:#97a0c8;--acc:#7c9cff;--ok:#5be3a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:16px}
.w{max-width:680px;margin:auto;display:grid;gap:12px}h1{font-size:20px;margin:4px 0}.c{background:var(--card);border-radius:14px;padding:14px;display:grid;gap:10px}
label{font-size:12px;color:var(--mut)}input,select,textarea,button{font:inherit;color:inherit;background:#0e1430;border:1px solid #2a3566;border-radius:10px;padding:10px;width:100%}
button{background:var(--acc);color:#0b1020;border:0;font-weight:700;cursor:pointer}button.s{background:#222c55;color:var(--ink)}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}pre{white-space:pre-wrap;margin:0}img{max-width:100%;border-radius:10px}
.b{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#1d2a55}.b.hit{background:#0f3a2c;color:var(--ok)}small{color:var(--mut)}
</style></head><body><div class="w">
<h1>AI Lab <small>· Alireza Yazdi</small></h1>
<div class="c">
 <div class="r"><div><label>Provider</label><select id="prov"><option value="pollinations">Pollinations (no key)</option><option value="huggingface">Hugging Face (your token)</option></select></div>
 <div><label>Type</label><select id="kind"><option value="text">Text</option><option value="image">Image</option></select></div></div>
 <div><label>Model (Hugging Face only)</label><input id="model" placeholder="e.g. Qwen/Qwen2.5-7B-Instruct or black-forest-labs/FLUX.1-schnell"></div>
 <div id="tokw" hidden><label>Hugging Face token (kept only in this browser's sessionStorage; never cached or sent elsewhere)</label><input id="tok" type="password" autocomplete="off" placeholder="hf_…"></div>
 <div><label>Prompt</label><textarea id="p" rows="3">Explain WebRTC in two sentences.</textarea></div>
 <div class="r"><button id="go">Generate</button><button id="re" class="s">Regenerate (skip cache)</button></div>
</div>
<div class="c"><div id="meta"><small>Results are stored in IndexedDB under a SHA-256 key of the request.</small></div><div id="out"></div></div>
<div class="c"><div id="st"><small></small></div><button id="clr" class="s">Clear cache</button></div>
</div>
<script src="../../assets/lib/ay-ai.js"></script>
<script>
const $=(i)=>document.getElementById(i);
function sync(){ $('tokw').hidden=$('prov').value!=='huggingface'; }
$('prov').onchange=sync; sync();
try{$('tok').value=sessionStorage.getItem('hf')||''}catch(e){}
async function stats(){const s=await AYAI.stats();$('st').firstChild.textContent=s.entries+' cached · '+(s.bytes/1024).toFixed(1)+' KB';}
async function run(refresh){
  const o=$('out'),m=$('meta'); o.textContent='…'; const tok=$('tok').value.trim();
  try{sessionStorage.setItem('hf',tok)}catch(e){}
  try{
    const r=await AYAI.generate({kind:$('kind').value,provider:$('prov').value,model:$('model').value.trim()||undefined,prompt:$('p').value,token:tok},{refresh});
    m.innerHTML='<span class="b '+(r.fromCache?'hit':'')+'">'+(r.fromCache?'from IndexedDB':'fresh')+'</span> <small>SHA-256 '+r.key.slice(0,16)+'…</small>';
    o.textContent='';
    if(typeof r.value==='string'){const p=document.createElement('pre');p.textContent=r.value;o.append(p);}
    else{const i=new Image();i.src=URL.createObjectURL(r.value);o.append(i);}
  }catch(e){o.textContent='';const p=document.createElement('pre');p.textContent='Error: '+e.message+(e.retryAfter?' (retry in '+e.retryAfter+'s)':'');o.append(p);}
  stats();
}
$('go').onclick=()=>run(false);$('re').onclick=()=>run(true);$('clr').onclick=async()=>{await AYAI.store.clear();stats();};
stats();
</script></body></html>
