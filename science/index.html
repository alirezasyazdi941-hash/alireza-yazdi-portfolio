<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Research · Alireza Yazdi</title>
<style>
@font-face{font-family:Vazirmatn;font-weight:100 900;font-display:swap;src:url(fonts/vazirmatn-arabic-wght-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE80-FEFC}
@font-face{font-family:Vazirmatn;font-weight:100 900;font-display:swap;src:url(fonts/vazirmatn-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--sep:#38383a;--tx:#fff;--tx2:#8e8e93;--tx3:#636366;
 --c1:#0a84ff;--c2:#64d2ff;--c3:#ff9f0a;--c4:#30d158;--fill:#767680;
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Vazirmatn,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-font-smoothing:antialiased;line-height:1.5}
.screen{max-width:560px;margin:auto;padding:16px 16px 60px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.back{width:44px;height:44px;border-radius:50%;background:#1c1c1ecc;border:0;color:var(--tx);font-size:22px;display:grid;place-items:center;text-decoration:none;backdrop-filter:blur(10px)}
.nav h1{font-size:17px;font-weight:600;margin:0}
.lang{border:0;background:#1c1c1e;color:var(--tx);border-radius:16px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg{display:flex;background:#1c1c1e;border-radius:12px;padding:2px;margin:6px 0 22px}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;font-weight:600;font-size:15px;padding:8px;border-radius:10px;cursor:pointer}
.seg button.on{background:#636366}
h2.sec{font-size:15px;font-weight:600;color:var(--tx2);margin:0 4px 8px}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:18px}
.date{color:var(--tx2);font-size:15px}
.big{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:2px 0 10px}
.big small{font-size:20px;font-weight:500;color:var(--tx2);margin-inline-start:6px}
svg{display:block;width:100%;height:auto;direction:ltr}
.legend{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.legend div{min-width:0}
.legend b{display:block;font-weight:500;font-size:14px}
.legend span{font-size:21px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:.5px solid var(--sep)}
.row:first-of-type{border-top:0}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.row .n{flex:1;min-width:0}
.row .n small{display:block;color:var(--tx2);font-size:13px}
.row .v{font-weight:600}
.add{display:flex;gap:6px}
.add button{border:0;background:var(--card2);color:var(--c1);font:inherit;font-weight:600;font-size:13px;padding:6px 10px;border-radius:14px;cursor:pointer}
.add button:active{background:#3a3a3c}
.link{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:.5px solid var(--sep);text-decoration:none;color:var(--tx)}
.link:first-of-type{border-top:0}
.link small{color:var(--tx2);display:block;font-size:13px}
.chev{color:var(--tx3);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--card2);border-radius:14px;padding:6px 12px;font-size:14px}
.note{color:var(--tx2);font-size:13px;margin:0 4px 18px}
.reset{border:0;background:transparent;color:#ff453a;font:inherit;font-size:15px;cursor:pointer;padding:8px 4px}
button:focus-visible,a:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
</style>
</head>
<body>
<div class="screen">
 <div class="nav"><a class="back" id="back" href="../index.html" aria-label="back">‹</a><h1 id="title"></h1><button class="lang" id="lang">FA · EN</button></div>
 <div class="seg" role="tablist"><button id="bW" role="tab"></button><button id="bD" role="tab"></button></div>

 <h2 class="sec" id="hStudy"></h2>
 <div class="card">
  <div class="date" id="date"></div>
  <div class="big" id="total"></div>
  <svg id="chart" viewBox="0 0 340 170" role="img" aria-label="chart"></svg>
  <div class="legend" id="legend"></div>
 </div>
 <p class="note" id="noteStudy"></p>

 <h2 class="sec" id="hLog"></h2>
 <div class="card" id="log"></div>

 <h2 class="sec" id="hProj"></h2>
 <div class="card" id="proj"></div>

 <h2 class="sec" id="hInt"></h2>
 <div class="card"><div class="chips" id="ints"></div></div>

 <button class="reset" id="reset"></button>
</div>
<script src="../assets/data.js"></script>
<script>
(function(){
'use strict';
var P=window.PORTFOLIO,KEY='ay-science-log-v1';
var CATS=[
 {id:'ml',c:'var(--c1)',hex:'#0a84ff',en:'Math & ML',fa:'ریاضی و ML'},
 {id:'proj',c:'var(--c2)',hex:'#64d2ff',en:'Projects',fa:'پروژه'},
 {id:'read',c:'var(--c3)',hex:'#ff9f0a',en:'Reading',fa:'مقاله‌خوانی'},
 {id:'write',c:'var(--c4)',hex:'#30d158',en:'English & writing',fa:'انگلیسی و نگارش'}];
var L={
 en:{title:'Research',week:'Week',day:'Day',hStudy:'Study time',hLog:'Log a session',hProj:'Projects',hInt:'Research interests',
  note:'Self-logged on this device. Nothing here is estimated or uploaded.',reset:'Reset my log',h:'h',m:'m',today:'Today',tot:'Total',none:'No sessions yet',confirm:'Delete all logged sessions?'},
 fa:{title:'پژوهش',week:'هفته',day:'روز',hStudy:'زمان مطالعه',hLog:'ثبت جلسه',hProj:'پروژه‌ها',hInt:'علایق پژوهشی',
  note:'ثبت‌شده توسط خودم، فقط روی همین دستگاه. چیزی تخمینی نیست و جایی ارسال نمی‌شود.',reset:'پاک‌کردن ثبت‌ها',h:'ساعت',m:'دقیقه',today:'امروز',tot:'مجموع',none:'هنوز جلسه‌ای ثبت نشده',confirm:'همه‌ی جلسه‌های ثبت‌شده پاک شود؟'}};
var lang='fa',mode='week',data={};
try{lang=localStorage.getItem('ay-sci-lang')||'fa';data=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function days(n){var a=[],t=new Date();t.setHours(12);for(var i=n-1;i>=0;i--){var d=new Date(t);d.setDate(t.getDate()-i);a.push(d)}return a}
function sum(day){var r={};CATS.forEach(function(c){r[c.id]=(data[day]&&data[day][c.id])||0});return r}
function fmt(min){var t=L[lang],h=Math.floor(min/60),m=min%60;if(!min)return '0 '+t.m;return (h?h+' '+t.h+' ':'')+(m?m+' '+t.m:'')}
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function nf(s){return lang==='fa'?String(s).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]}):String(s)}
function render(){
  var t=L[lang],fa=lang==='fa';document.documentElement.lang=lang;document.documentElement.dir=fa?'rtl':'ltr';
  $('title').textContent=t.title;$('bW').textContent=t.week;$('bD').textContent=t.day;
  $('bW').className=mode==='week'?'on':'';$('bD').className=mode==='day'?'on':'';
  $('hStudy').textContent=t.hStudy;$('hLog').textContent=t.hLog;$('hProj').textContent=t.hProj;$('hInt').textContent=t.hInt;
  $('noteStudy').textContent=t.note;$('reset').textContent=t.reset;
  var ds=days(7),today=dk(new Date()),keys=mode==='week'?ds.map(dk):[today];
  var tot={};CATS.forEach(function(c){tot[c.id]=0});
  keys.forEach(function(k){var s=sum(k);CATS.forEach(function(c){tot[c.id]+=s[c.id]})});
  var all=CATS.reduce(function(a,c){return a+tot[c.id]},0);
  $('date').textContent=(mode==='week'?t.week:t.today)+' · '+new Date().toLocaleDateString(fa?'fa-IR':'en-US',{month:'long',day:'numeric'});
  $('total').textContent='';var big=el('span','',nf(Math.floor(all/60)));$('total').appendChild(big);$('total').appendChild(el('small','',t.h));
  $('total').appendChild(el('span','',' '+nf(all%60)));$('total').appendChild(el('small','',t.m));
  /* chart */
  var W=340,H=170,base=140,svg='',wk=['S','M','T','W','T','F','S'];
  var series=mode==='week'?ds.map(function(d){return {k:dk(d),l:d.toLocaleDateString('en-US',{weekday:'narrow'})}}):[{k:today,l:''}];
  var maxv=Math.max.apply(null,series.map(function(s){var r=sum(s.k);return CATS.reduce(function(a,c){return a+r[c.id]},0)}).concat([60]));
  [0,.5,1].forEach(function(f){var y=base-f*110;svg+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#38383a" stroke-width=".6" stroke-dasharray="3 3"/>';});
  svg+='<text x="'+W+'" y="'+(base-110-3)+'" text-anchor="end" fill="#636366" font-size="10">'+Math.ceil(maxv/60*10)/10+t.h.charAt(0)+'</text>';
  var bw=mode==='week'?30:90,gap=(W-series.length*bw)/(series.length+1);
  series.forEach(function(s,i){
    var x=gap+i*(bw+gap),r=sum(s.k),y=base;
    CATS.forEach(function(c){var h=r[c.id]/maxv*110;if(h>0){y-=h;svg+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" fill="'+c.hex+'" rx="3"/>';}});
    if(!(y<base))svg+='<rect x="'+x+'" y="'+(base-3)+'" width="'+bw+'" height="3" fill="#38383a" rx="1.5"/>';
    if(s.l)svg+='<text x="'+(x+bw/2)+'" y="'+(base+20)+'" text-anchor="middle" fill="'+(s.k===today?'#fff':'#636366')+'" font-size="12">'+s.l+'</text>';
  });
  $('chart').innerHTML=svg;
  var lg=$('legend');lg.textContent='';
  CATS.forEach(function(c){var d=el('div');var b=el('b',null,fa?c.fa:c.en);b.style.color=c.hex;d.appendChild(b);d.appendChild(el('span','',nf(Math.floor(tot[c.id]/60))+(fa?'س ':'h ')+nf(tot[c.id]%60)+(fa?'د':'m')));lg.appendChild(d)});
  /* log */
  var lgx=$('log');lgx.textContent='';var ts=sum(today);
  CATS.forEach(function(c){
    var r=el('div','row'),d=el('span','dot');d.style.background=c.hex;
    var n=el('div','n',fa?c.fa:c.en);n.appendChild(el('small','',t.today+' · '+nf(fmt(ts[c.id]))));
    var a=el('div','add');
    [15,30,60].forEach(function(m){var b=el('button','','+'+nf(m));b.setAttribute('aria-label','+'+m+' min '+c.en);b.addEventListener('click',function(){data[today]=data[today]||{};data[today][c.id]=(data[today][c.id]||0)+m;save();render();});a.appendChild(b)});
    r.appendChild(d);r.appendChild(n);r.appendChild(a);lgx.appendChild(r);
  });
  /* projects */
  var pj=$('proj');pj.textContent='';
  P.apps.filter(function(x){return x.cat==='research'||x.cat==='ai'}).forEach(function(x){
    var a=el('a','link');a.href='../'+x.path;var w=el('div');w.appendChild(el('span','',x.name[lang]));w.appendChild(el('small','',(x.tech||[]).join(' · ')));
    a.appendChild(w);a.appendChild(el('span','chev',fa?'‹':'›'));pj.appendChild(a);
  });
  var ints=$('ints');ints.textContent='';P.profile.interests[lang].forEach(function(s){ints.appendChild(el('span','',s))});
}
$('bW').onclick=function(){mode='week';render()};$('bD').onclick=function(){mode='day';render()};
$('lang').onclick=function(){lang=lang==='fa'?'en':'fa';try{localStorage.setItem('ay-sci-lang',lang)}catch(e){}render()};
$('reset').onclick=function(){if(confirm(L[lang].confirm)){data={};save();render()}};
render();
})();
</script>
</body>
</html>
