<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>NONONICK SITE OS</title>
<style>
/* ============================================================
   APP DESIGN TOKENS
   ============================================================ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-fa: "Vazirmatn", "IRANSans", Tahoma, system-ui, sans-serif;
  --bg:#0a0c10;
  --surface:#111419;
  --surface-2:#171b22;
  --surface-3:#1e232c;
  --text:#eef2f7;
  --text-2:#98a2b3;
  --text-3:#667085;
  --border:#232a34;
  --border-2:#2e3745;
  --accent:#22d3ee;
  --accent-2:#8b5cf6;
  --accent-ink:#04141a;
  --ok:#34d399;
  --warn:#fbbf24;
  --danger:#f87171;
  --shadow: 0 12px 40px rgba(0,0,0,.5);
  --shadow-sm: 0 4px 16px rgba(0,0,0,.35);
  --r: 16px;
  --r-sm: 10px;
  --r-lg: 24px;
  --hdr: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"]{
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#ffffff;
  --surface-3:#f0f3f7;
  --text:#0b1220;
  --text-2:#5a6779;
  --text-3:#8b96a6;
  --border:#e2e7ee;
  --border-2:#d3dae4;
  --accent:#0ea5e9;
  --accent-2:#7c3aed;
  --accent-ink:#ffffff;
  --shadow: 0 16px 44px rgba(16,24,40,.10);
  --shadow-sm: 0 4px 14px rgba(16,24,40,.07);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  transition:background .25s ease,color .25s ease;
}
html[dir="rtl"] body{font-family:var(--font-fa)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============================================================
   SCREENS
   ============================================================ */
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.hdr{
  display:flex;align-items:center;gap:10px;
  min-height:var(--hdr);padding:8px 14px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--border);
  position:relative;z-index:20;flex-shrink:0;
}
.hdr .title{font-weight:650;font-size:15px;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}

/* ============================================================
   BUTTONS / CONTROLS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  transition:transform .12s ease,background .18s ease,border-color .18s;
  user-select:none;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:active{filter:brightness(.93)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.block{width:100%}
.btn.sm{padding:8px 13px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{
  width:38px;height:38px;min-width:38px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-2);
  transition:background .18s,color .18s,transform .12s;
}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn:active{transform:scale(.92)}
.iconbtn.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
svg{display:block;width:20px;height:20px;stroke-width:1.7;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
svg.s16{width:16px;height:16px}
svg.s24{width:24px;height:24px}
html[dir="rtl"] .flip{transform:scaleX(-1)}

.field{display:block;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);
  margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase}
.input,.select,.textarea{
  width:100%;padding:12px 14px;border-radius:12px;
  background:var(--surface-3);border:1px solid var(--border);
  color:var(--text);font-size:15px;outline:none;
  transition:border-color .18s,background .18s;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent)}
.textarea{min-height:96px;resize:vertical;line-height:1.55}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:38px}
html[dir="rtl"] .select{background-position:18px 50%,13px 50%}

/* ============================================================
   CARDS / GRIDS
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;transition:border-color .2s,transform .15s;
}
.card.tap:active{transform:scale(.985)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}

/* ============================================================
   HOME
   ============================================================ */
.home-wrap{padding:22px 18px 120px;max-width:820px;margin:0 auto;width:100%}
.logo-block{margin:26px 0 30px}
.logo-mark{
  font-size:clamp(34px,10vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.98;
  background:linear-gradient(100deg,var(--text) 12%,var(--accent) 62%,var(--accent-2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo-sub{font-size:11px;font-weight:700;letter-spacing:.42em;color:var(--text-3);margin-top:10px;text-transform:uppercase}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);margin:28px 0 12px}
.proj-card{
  display:flex;gap:14px;align-items:center;padding:12px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--border);margin-bottom:10px;
  transition:transform .14s,border-color .2s;
}
.proj-card:active{transform:scale(.985);border-color:var(--border-2)}
.proj-thumb{
  width:64px;height:64px;border-radius:12px;flex-shrink:0;overflow:hidden;
  border:1px solid var(--border);background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;
}
.proj-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.proj-meta{flex:1;min-width:0}
.proj-name{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-sub{font-size:12px;color:var(--text-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;
  padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);
  border:1px solid var(--border);letter-spacing:.02em}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent);
  background:color-mix(in srgb,var(--ok) 12%,transparent)}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* empty state */
.empty{text-align:center;padding:56px 20px;color:var(--text-3)}
.empty h3{color:var(--text);font-size:18px;margin:14px 0 6px;font-weight:650}
.empty p{margin:0 0 20px;font-size:14px}

/* ============================================================
   WIZARD
   ============================================================ */
.wiz-progress{display:flex;gap:5px;padding:0 16px 12px;flex-shrink:0}
.wiz-progress i{height:3px;flex:1;border-radius:3px;background:var(--border);transition:background .3s}
.wiz-progress i.done{background:var(--accent)}
.wiz-progress i.cur{background:color-mix(in srgb,var(--accent) 55%,var(--border))}
.wiz-body{flex:1;overflow-y:auto;padding:6px 18px 130px;max-width:760px;margin:0 auto;width:100%}
.wiz-h1{font-size:clamp(22px,6vw,30px);font-weight:720;letter-spacing:-.03em;margin:8px 0 6px;line-height:1.15}
.wiz-h2{font-size:14px;color:var(--text-2);margin:0 0 22px}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.opt{
  padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);
  text-align:start;transition:border-color .18s,background .18s,transform .12s;
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
}
.opt:active{transform:scale(.975)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-3);color:var(--accent);font-size:15px}
.opt-name{font-weight:620;font-size:13.5px;line-height:1.25}
.opt-desc{font-size:11px;color:var(--text-3);line-height:1.35}
.opt-check{position:absolute;top:10px;inset-inline-end:10px;width:18px;height:18px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:none;align-items:center;justify-content:center;font-size:11px}
.opt.sel .opt-check{display:flex}

/* style cards */
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.style-card{border-radius:14px;overflow:hidden;border:1.5px solid var(--border);background:var(--surface);
  transition:border-color .2s,transform .12s;text-align:start}
.style-card:active{transform:scale(.975)}
.style-card.sel{border-color:var(--accent)}
.style-prev{height:84px;position:relative;overflow:hidden;padding:10px;display:flex;flex-direction:column;gap:5px}
.style-prev .sp-bar{height:6px;border-radius:3px;opacity:.95}
.style-card .opt-name{padding:9px 11px;font-size:12.5px}

/* swatches */
.swatch-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.swatch-row:last-child{border-bottom:0}
.swatch-lbl{flex:1;font-size:13.5px;font-weight:550}
.swatch{width:40px;height:40px;border-radius:11px;border:1px solid var(--border-2);padding:0;
  overflow:hidden;cursor:pointer;position:relative;flex-shrink:0}
.swatch input{position:absolute;inset:-8px;width:200%;height:200%;border:0;padding:0;cursor:pointer;opacity:0}
.palette-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pal{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border);display:flex;overflow:hidden;padding:0}
.pal span{flex:1}

/* toggle */
.tgl-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.tgl-row:last-child{border-bottom:0}
.tgl-txt{flex:1}
.tgl-txt b{display:block;font-size:14px;font-weight:600}
.tgl-txt small{font-size:11.5px;color:var(--text-3)}
.tgl{width:46px;height:27px;border-radius:99px;background:var(--border-2);position:relative;
  transition:background .22s;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.tgl.on{background:var(--accent)}
.tgl.on::after{transform:translateX(19px)}
html[dir="rtl"] .tgl.on::after{transform:translateX(-19px)}

/* wizard footer */
.wiz-foot{
  position:absolute;inset-inline:0;bottom:0;padding:12px 18px calc(12px + var(--safe-b));
  display:flex;gap:10px;
  background:linear-gradient(to top,var(--bg) 62%,transparent);
  z-index:30;
}
.wiz-foot .btn{flex:1}

/* summary */
.sum-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
.sum-row:last-child{border-bottom:0}
.sum-row span:first-child{color:var(--text-2)}
.sum-row span:last-child{font-weight:620}
.gen-list{list-style:none;padding:0;margin:20px 0 0}
.gen-list li{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14px;color:var(--text-2);
  opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.gen-list li.show{opacity:1;transform:none}
.gen-list li .gcheck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.gen-list li.done{color:var(--text)}
.gen-list li.done .gcheck{background:var(--ok);border-color:var(--ok);color:#04231a}

/* ============================================================
   EDITOR
   ============================================================ */
#editor{background:var(--surface-3)}
.ed-canvas{
  flex:1;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%, color-mix(in srgb,var(--accent) 7%,transparent), transparent 60%),
    var(--surface-3);
  display:flex;align-items:stretch;justify-content:center;padding:0;
}
.ed-frame-wrap{position:relative;transition:width .25s ease,height .25s ease;
  background:#fff;box-shadow:0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,.35);
  overflow:hidden;transform-origin:top center}
.ed-frame-wrap.mobile{border-radius:26px;margin:14px 0}
.ed-frame-wrap.tablet{border-radius:18px;margin:12px 0}
.ed-frame{width:100%;height:100%;border:0;display:block;background:#fff}

.ed-top{display:flex;align-items:center;gap:4px;padding:7px 10px;min-height:52px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);z-index:25;flex-shrink:0}
.ed-title{font-size:13.5px;font-weight:640;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-align:center;padding:0 4px}
.save-dot{font-size:10.5px;color:var(--text-3);display:flex;align-items:center;gap:5px;font-weight:600}

.dev-switch{display:flex;gap:2px;background:var(--surface-3);border-radius:10px;padding:3px;border:1px solid var(--border)}
.dev-switch button{width:32px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.dev-switch button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}

.ed-dock{
  position:absolute;inset-inline:0;bottom:0;z-index:30;
  padding:10px 10px calc(10px + var(--safe-b));
  pointer-events:none;
}
.dock-bar{
  pointer-events:auto;display:flex;gap:2px;padding:6px;overflow-x:auto;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  scrollbar-width:none;max-width:640px;margin:0 auto;
}
.dock-bar::-webkit-scrollbar{display:none}
.dock-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;gap:2px;
  padding:7px 12px;border-radius:14px;color:var(--text-2);font-size:9.5px;font-weight:650;
  letter-spacing:.02em;min-width:56px;flex-shrink:0;transition:background .18s,color .18s;
}
.dock-btn.on,.dock-btn:active{background:var(--surface-3);color:var(--accent)}

/* selection toolbar */
.sel-bar{
  pointer-events:auto;display:flex;gap:4px;padding:6px;margin:0 auto 8px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;
  transform:translateY(8px);opacity:0;transition:transform .2s,opacity .2s;
}
.sel-bar::-webkit-scrollbar{display:none}
.sel-bar.show{transform:none;opacity:1}
.sel-bar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 11px;border-radius:11px;
  color:var(--text-2);font-size:9.5px;font-weight:650;min-width:52px;transition:background .18s,color .18s}
.sel-bar button:active,.sel-bar button:hover{background:var(--surface-3);color:var(--text)}
.sel-bar button.danger:hover{color:var(--danger)}
.sel-tag{position:absolute;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;
  background:var(--accent);color:var(--accent-ink);pointer-events:none;z-index:40;
  transform:translateY(-100%);white-space:nowrap;opacity:0;transition:opacity .15s}
.sel-tag.show{opacity:1}

/* ============================================================
   SHEET / DRAWER
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;opacity:0;
  transition:opacity .24s;backdrop-filter:blur(2px)}
.scrim.show{opacity:1}
.sheet{
  position:fixed;z-index:90;background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  inset-inline:0;bottom:0;max-height:86vh;
  border-radius:24px 24px 0 0;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.sheet.show{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:4px;background:var(--border-2);margin:9px auto 2px;flex-shrink:0}
.sheet-hdr{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;flex-shrink:0;
  border-bottom:1px solid var(--border)}
.sheet-hdr h3{margin:0;font-size:16px;font-weight:680;flex:1;letter-spacing:-.01em}
.sheet-body{overflow-y:auto;padding:16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--border);
  display:flex;gap:10px;flex-shrink:0}
.sheet-foot .btn{flex:1}

@media(min-width:900px){
  .sheet{
    inset-inline:auto;inset-inline-end:0;top:0;bottom:0;width:400px;max-height:none;
    border-radius:0;transform:translateX(102%);
    border-top:0;border-bottom:0;
  }
  html[dir="rtl"] .sheet{transform:translateX(-102%)}
  .sheet.show{transform:none}
  .sheet-grab{display:none}
  .sheet-hdr{padding-top:16px}
  .sheet-foot{padding-bottom:16px}
}

/* accordion */
.acc{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--surface-2)}
.acc-h{display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:600;font-size:14px;width:100%;text-align:start}
.acc-h svg{margin-inline-start:auto;color:var(--text-3);transition:transform .22s}
.acc.open .acc-h svg{transform:rotate(180deg)}
.acc-b{display:none;padding:0 14px 14px}
.acc.open .acc-b{display:block}

/* range */
.range-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.range-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:4px;
  background:var(--border-2);outline:none}
.range-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer}
.range-row input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);cursor:pointer}

/* lists inside sheets */
.list-item{display:flex;align-items:center;gap:11px;padding:11px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);margin-bottom:8px}
.list-item.dragging{opacity:.4}
.list-item.over{border-color:var(--accent)}
.li-body{flex:1;min-width:0}
.li-title{font-size:14px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-sub{font-size:11.5px;color:var(--text-3)}
.li-actions{display:flex;gap:2px}

/* assets grid */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.asset{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1.5px solid var(--border);
  background:var(--surface-3);display:flex;align-items:center;justify-content:center}
.asset img{width:100%;height:100%;object-fit:cover}
.asset.sel{border-color:var(--accent)}
.asset .a-name{position:absolute;inset-inline:0;bottom:0;font-size:9px;padding:3px 5px;
  background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.upload-tile{border:1.5px dashed var(--border-2);border-radius:12px;aspect-ratio:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--text-3);font-size:11px;font-weight:600;cursor:pointer}

/* seo status */
.seo-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.seo-row:last-child{border-bottom:0}
.seo-lbl{flex:1;font-size:13.5px;font-weight:550}
.seo-val{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.seo-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;flex-shrink:0}
.seo-badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.seo-badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.seo-badge.bad{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}

/* toast */
#toast{position:fixed;inset-inline:0;bottom:calc(20px + var(--safe-b));z-index:200;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:11px 16px;font-size:13.5px;font-weight:550;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:9px;max-width:420px;
  animation:tin .26s cubic-bezier(.32,.72,0,1);
}
.toast.err{border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.toast.ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--border))}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* misc */
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.muted{color:var(--text-3);font-size:12.5px}
.divider{height:1px;background:var(--border);margin:16px 0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border);
  font-size:12.5px;font-weight:600;color:var(--text-2);transition:.16s}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
.mini-preview{width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:1px solid var(--border);
  background:var(--surface-3)}
.mini-preview iframe{width:100%;height:100%;border:0;pointer-events:none;display:block}
.spin{width:16px;height:16px;border:2px solid var(--border-2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

let prefs = { lang:'en', theme:'dark', device:'mobile' };
function loadPrefs(){
  try{ const s = localStorage.getItem(CONFIG.prefsKey); if(s) Object.assign(prefs, JSON.parse(s)); }catch(e){}
  if(prefs.theme === 'system'){
    prefs.theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  UI_LANG = prefs.lang || 'en';
  applyShellTheme();
}
function savePrefs(){ try{ localStorage.setItem(CONFIG.prefsKey, JSON.stringify(prefs)); }catch(e){} }
function applyShellTheme(){
  document.documentElement.setAttribute('data-theme', prefs.theme);
  document.documentElement.setAttribute('lang', UI_LANG);
  document.documentElement.setAttribute('dir', UI_LANG === 'fa' ? 'rtl' : 'ltr');
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', prefs.theme === 'dark' ? '#0a0c10' : '#f4f6f9');
}

/* ============================================================================
   STORAGE (IndexedDB, localStorage fallback)
   ============================================================================ */
const DB = {
  _db: null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      if(!window.indexedDB) return rej(new Error('no-idb'));
      const r = indexedDB.open(CONFIG.dbName, 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', {keyPath:'id'});
      };
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(rec){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('projects','readwrite');
      tx.objectStore('projects').put(rec);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  },
  async all(){
    try{
      const db = await this.open();
      return await new Promise((res, rej) => {
        const tx = db.transaction('projects','readonly');
        const rq = tx.objectStore('projects').getAll();
        rq.onsuccess = () => res(rq.result || []);
        rq.onerror = () => rej(rq.error);
      });
    }catch(e){
      // localStorage fallback
      try{ return JSON.parse(localStorage.getItem('nononick.projects') || '[]'); }catch(e2){ return []; }
    }
  },
  async get(id){
    try{
      const db = await this.open();
      return await new Promise((res, rej) => {
        const tx = db.transaction('projects','readonly');
        const rq = tx.objectStore('projects').get(id);
        rq.onsuccess = () => res(rq.result || null);
        rq.onerror = () => rej(rq.error);
      });
    }catch(e){ return null; }
  },
  async del(id){
    try{
      const db = await this.open();
      return await new Promise((res) => {
        const tx = db.transaction('projects','readwrite');
        tx.objectStore('projects').delete(id);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      });
    }catch(e){ return false; }
  }
};

function deriveDark(c){
  return {
    primary: c.primary,
    secondary: lighten(c.secondary, 10),
    accent: c.accent,
    bg: '#0a0d12',
    text: '#e9eef6'
  };
}
function lighten(hex, amt){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(x=>x+x).join('') : h, 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = clamp(r + amt,0,255); g = clamp(g + amt,0,255); b = clamp(b + amt,0,255);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function slugify(s){ return String(s).toLowerCase().trim().replace(/[^a-z0-9\u0600-\u06FF]+/g,'-').replace(/^-|-$/g,'') || 'page'; }

        title:'', items: [
          {title: L('Section one','بخش یک'), text: L('Edit this content in the editor.','این محتوا را در ویرایشگر تغییر دهید.')},
          {title: L('Section two','بخش دو'), text: L('Everything here is editable.','همه چیز اینجا قابل ویرایش است.')}
        ]
      });
      S('footer', { text: L('© ' + new Date().getFullYear() + ' ' + B, '© ' + new Date().getFullYear() + ' ' + B) });
  }
  return secs;
}

const FONTS = {
  system:  {en:'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', fa:'Vazirmatn, Tahoma, system-ui, sans-serif'},
  serif:   {en:'Georgia, "Times New Roman", serif', fa:'"Noto Naskh Arabic", Tahoma, serif'},
  mono:    {en:'ui-monospace, SFMono-Regular, Menlo, monospace', fa:'Tahoma, monospace'},
  rounded: {en:'"SF Pro Rounded", "Segoe UI", system-ui, sans-serif', fa:'Vazirmatn, Tahoma, sans-serif'}
};

function resolveImg(v, p){
  if(!v) return PLACEHOLDER_IMG;
  if(typeof v === 'string' && v.indexOf('asset:') === 0){
    const id = v.slice(6);
    const a = (p.assets||[]).find(x => x.id === id);
    return a ? a.dataUrl : PLACEHOLDER_IMG;
  }
  return v;
}

function buildCtx(p, opts){
  const editable = !!opts.editable;
  const lang = opts.lang || p.settings.lang;
  const T = (v) => {
    if(v == null) return '';
    if(typeof v === 'string') return v;
    return v[lang] != null ? v[lang] : (v.en != null ? v.en : (v.fa != null ? v.fa : ''));
  };
  const A = (sec, key) => {
    const v = getPath(sec, key);
    let out = '';
    if(editable) out += ` data-txt="${escAttr(key)}"`;
    if(v && typeof v === 'object' && (v.en != null || v.fa != null)){
      out += ` data-en="${escAttr(v.en||'')}" data-fa="${escAttr(v.fa||'')}"`;
    }
    return out;
  };
  const IMG = (sec, key, cls, extra) => {
    const v = getPath(sec, key);
    const src = resolveImg(v, p);
    const alt = T(getPath(sec, key + 'Alt')) || T(getPath(sec, 'props.title')) || '';
    return `<img src="${escAttr(src)}" alt="${escAttr(alt)}" loading="lazy" decoding="async"${editable?` data-img="${escAttr(key)}"`:''}${cls?` class="${cls}"`:''}${extra||''}>`;
  };
  return {editable, lang, T, A, IMG, p, dir: lang === 'fa' ? 'rtl' : 'ltr'};
}

function mix(a, b, w){
  const pa = hex2rgb(a), pb = hex2rgb(b);
  const r = Math.round(pa[0]*(1-w) + pb[0]*w);
  const g = Math.round(pa[1]*(1-w) + pb[1]*w);
  const bl = Math.round(pa[2]*(1-w) + pb[2]*w);
  return '#' + [r,g,bl].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');
}
function hex2rgb(h){
  h = String(h||'#000').replace('#','');
  if(h.length === 3) h = h.split('').map(x=>x+x).join('');
  const n = parseInt(h,16) || 0;
  return [(n>>16)&255, (n>>8)&255, n&255];
}

function siteJS(p, opts){
  const motion = p.motion || 'smooth';
  return `
(function(){
  var root=document.documentElement;
  try{

    if(saved) root.setAttribute('data-theme',saved);
  }catch(e){}
  var tb=document.querySelector('[data-nk-theme]');
  if(tb) tb.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',cur);
    try{localStorage.setItem('nk-theme',cur);}catch(e){}
  });
  var lb=document.querySelector('[data-nk-lang]');
  function setLang(l){
    root.setAttribute('lang',l);
    root.setAttribute('dir', l==='fa'?'rtl':'ltr');
    var nodes=document.querySelectorAll('[data-en],[data-fa]');
    for(var i=0;i<nodes.length;i++){
      var v=nodes[i].getAttribute('data-'+l);
      if(v!=null) nodes[i].textContent=v;
    }
    try{localStorage.setItem('nk-lang',l);}catch(e){}
  }
  if(lb){
    var savedLang=null;
    try{savedLang=localStorage.getItem('nk-lang');}catch(e){}
    if(savedLang) setLang(savedLang);
    lb.addEventListener('click',function(){
      var cur=root.getAttribute('lang')==='fa'?'en':'fa';
      setLang(cur);
      lb.textContent = cur==='fa'?'EN':'FA';
    });
  }
  var bg=document.querySelector('[data-nk-burger]');
  var mob=document.querySelector('[data-nk-mob]');
  if(bg&&mob) bg.addEventListener('click',function(){ mob.classList.toggle('open'); });
  ${motion !== 'static' && opts && opts.exportMode ? `
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    },{threshold:.12,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.nk-card,.nk-media,.nk-hero-img,.nk-gal div,.nk-cta-box,.nk-stat').forEach(function(el){
      el.classList.add('nk-reveal'); io.observe(el);
    });
  }` : ''}
})();`;
}

function editorBridge(p){
  return `<script>
(function(){
  var current=null, currentType=null, currentSec=null, currentKey=null;
  function clearSel(){ if(current) current.style.outline=''; current=null; currentType=null; }
  function outline(el, color){
    el.style.outline='2px solid '+color;
    el.style.outlineOffset='2px';
  }
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-txt],[data-img],[data-sec]');
    if(!el){ parent.postMessage({type:'nk-clear'},'*'); return; }
    e.preventDefault(); e.stopPropagation();
    clearSel();
    var secEl = el.closest('[data-sec]');
    var secId = secEl ? secEl.getAttribute('data-sec') : null;
    if(el.hasAttribute('data-txt')){
      current = el; currentType='text'; currentSec = secId; currentKey = el.getAttribute('data-txt');
      outline(el, '#22d3ee');
    } else if(el.hasAttribute('data-img')){
      current = el; currentType='image'; currentSec = secId; currentKey = el.getAttribute('data-img');
      outline(el, '#8b5cf6');
    } else {
      current = secEl; currentType='section'; currentSec = secId; currentKey = null;
      outline(secEl, 'rgba(34,211,238,.6)');
    }
    var r = (currentType==='section' ? current : el).getBoundingClientRect();
    parent.postMessage({type:'nk-select', sec:secId, key:currentKey, kind:currentType,
      rect:{x:r.x,y:r.y,w:r.width,h:r.height}}, '*');
  }, true);

  document.addEventListener('submit', function(e){ e.preventDefault(); }, true);

  window.addEventListener('message', function(ev){
    var d = ev.data || {};
    if(d.type === 'nk-edit-inline'){
      var el = document.querySelector('[data-sec="'+d.sec+'"] [data-txt="'+d.key+'"]');
      if(!el) return;
      el.setAttribute('contenteditable','true');
      el.style.outline='2px solid #22d3ee';
      el.focus();
      try{
        var rng=document.createRange(); rng.selectNodeContents(el);
        var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rng);
      }catch(e){}
      var done = function(){
        el.removeAttribute('contenteditable');
        el.style.outline='';
        var val = el.textContent.trim();
        parent.postMessage({type:'nk-text', sec:d.sec, key:d.key, value:val, lang:d.lang}, '*');
        el.removeEventListener('blur', done);
      };
      el.addEventListener('blur', done);
    }
    if(d.type === 'nk-scroll'){
      window.scrollTo(0, d.y||0);
    }
    if(d.type === 'nk-ping'){
      parent.postMessage({type:'nk-pong', y: window.scrollY}, '*');
    }
  });

  var st;
  window.addEventListener('scroll', function(){
    clearTimeout(st);
    st=setTimeout(function(){ parent.postMessage({type:'nk-scrollpos', y:window.scrollY},'*'); }, 250);
  }, {passive:true});

  document.addEventListener('click', function(e){
    var a = e.target.closest('[data-goto]');
    if(a){ e.preventDefault(); parent.postMessage({type:'nk-goto', page:a.getAttribute('data-goto')},'*'); }
  });
})();
<\/script>`;
}

/* ============================================================================
   ZIP (writer + reader, no dependencies)
   ============================================================================ */
let CRC_TABLE = null;
function crc32(buf){
  if(!CRC_TABLE){
    CRC_TABLE = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[n] = c >>> 0;
    }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipCreate(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const DOS_DATE = 0x21, DOS_TIME = 0;
  for(const f of files){
    const nameBytes = enc.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : enc.encode(String(f.data));
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, DOS_TIME, true);
    dv.setUint16(12, DOS_DATE, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, DOS_TIME, true);
    cv.setUint16(14, DOS_DATE, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    central.push(ch);
    offset += lh.length + data.length;
  }
  const cdStart = offset;
  let cdSize = 0; central.forEach(c => cdSize += c.length);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, cdStart, true);
  return new Blob(parts.concat(central, [eocd]), {type:'application/zip'});
}

async function zipRead(arrayBuffer){
  const dv = new DataView(arrayBuffer);
  const len = arrayBuffer.byteLength;
  let eocd = -1;
  for(let i = len - 22; i >= Math.max(0, len - 65558); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('not-a-zip');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entries = [];
  for(let i = 0; i < count; i++){
    if(off + 46 > len || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = new TextDecoder().decode(new Uint8Array(arrayBuffer, off + 46, nlen));
    const lnlen  = dv.getUint16(lho + 26, true);
    const lelen  = dv.getUint16(lho + 28, true);
    const start  = lho + 30 + lnlen + lelen;
    entries.push({name, method, data: new Uint8Array(arrayBuffer, start, csize)});
    off += 46 + nlen + elen + clen;
  }
  for(const e of entries){
    if(e.method === 0) e.bytes = e.data;
    else if(e.method === 8 && typeof DecompressionStream !== 'undefined'){
      try{
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([e.data]).stream().pipeThrough(ds);
        e.bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      }catch(err){ e.bytes = null; }
    } else e.bytes = null;
  }
  return entries;
}

function dataUrlToBytes(d){
  const i = d.indexOf(',');
  const b64 = d.slice(i + 1);
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  return u;
}
function bytesToDataUrl(bytes, mime){
  let bin = '';
  const chunk = 0x8000;
  for(let i = 0; i < bytes.length; i += chunk){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return 'data:' + (mime || 'application/octet-stream') + ';base64,' + btoa(bin);
}
function mimeFromName(name){
  const ext = (name.split('.').pop() || '').toLowerCase();
  return ({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',
    svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm',ogg:'audio/ogg',woff:'font/woff',
    woff2:'font/woff2',css:'text/css',js:'application/javascript',html:'text/html',json:'application/json',
    txt:'text/plain',xml:'application/xml'})[ext] || 'application/octet-stream';
}

      title: h1 ? h1.textContent.trim() : p.name,
      subtitle: (doc.querySelector('h1 + p, p') || {}).textContent?.trim() || '',
      cta:'Get Started', cta2:'', image:'', layout:'split'
    }
  });

  // collect headings + paragraphs into cards
  const hs = Array.from(body.querySelectorAll('h2, h3')).slice(0, 8);
  if(hs.length){
    sections.push({
      id: uid('sec'), type:'services', hidden:false,
      props:{
        title:'', subtitle:'',
        items: hs.map(h => ({
          title: h.textContent.trim().slice(0, 80),
          text: (h.nextElementSibling && /^(P|SPAN|DIV)$/.test(h.nextElementSibling.tagName))
            ? h.nextElementSibling.textContent.trim().slice(0, 220) : ''
        }))
      }
    });
  } else {
    const ps = Array.from(body.querySelectorAll('p')).slice(0, 3).map(x=>x.textContent.trim()).filter(Boolean);
    if(ps.length){
      sections.push({
        id: uid('sec'), type:'about', hidden:false,
        props:{ title:'About', text: ps.join('\n\n').slice(0, 800), image:'', stats:[] }
      });
    }
  }

  const imgs = Array.from(body.querySelectorAll('img')).slice(0, 12);
  if(imgs.length){
    imgs.forEach((im, i) => {
      const src = im.getAttribute('src') || '';
      if(src && /^https?:/i.test(src)){
        p.assets.push({id: uid('as'), name: 'img-' + (i+1) + '.jpg', type:'image/jpeg', dataUrl: src, external:true, size:0});
      }
    });
    sections.push({id: uid('sec'), type:'gallery', hidden:false, props:{title:'', images: []}});
  }

  sections.push({id: uid('sec'), type:'cta', hidden:false, props:{title:'Get in touch', text:'We would love to hear from you.', cta:'Contact us'}});
  sections.push({id: uid('sec'), type:'footer', hidden:false, props:{text:'© ' + new Date().getFullYear() + ' ' + p.brand.name}});

  p.pages[0].sections = sections;
  p.updatedAt = now();
  return p;
}

async function importZIPProject(file){
  const buf = await file.arrayBuffer();
  const entries = await zipRead(buf);
  const htmlEntries = entries.filter(e => e.bytes && /\.html?$/i.test(e.name) && !/^__MACOSX/.test(e.name));
  if(!htmlEntries.length) throw new Error('no-html-in-zip');

  const p = baseProject();
  p.name = (file.name || 'Imported Site').replace(/\.zip$/i, '').slice(0, 60);
  p.brand.name = p.name;
  p.brand.siteName = p.name;
  p.pages = [];

  const sorted = htmlEntries.sort((a,b) => {
    const ai = /index\.html?$/i.test(a.name) ? 0 : 1;
    const bi = /index\.html?$/i.test(b.name) ? 0 : 1;
    return ai - bi;
  });

  for(const e of sorted.slice(0, 12)){
    const html = new TextDecoder().decode(e.bytes);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const rawName = e.name.split('/').pop().replace(/\.html?$/i,'');
    const title = doc.title || rawName;
    const sections = [];
    const h1 = doc.querySelector('h1');
    sections.push({
      id: uid('sec'), type:'hero', hidden:false,
      props:{ title: h1 ? h1.textContent.trim() : title, subtitle:'', cta:'Get Started', cta2:'', image:'', layout:'split' }
    });
    const hs = Array.from(doc.querySelectorAll('h2, h3')).slice(0, 6);
    if(hs.length){
      sections.push({
        id: uid('sec'), type:'cards', hidden:false,
        props:{ title:'', items: hs.map(h => ({title: h.textContent.trim().slice(0,80), text: (h.nextElementSibling?h.nextElementSibling.textContent.trim().slice(0,200):'')})) }
      });
    }
    sections.push({id: uid('sec'), type:'footer', hidden:false, props:{text:'© ' + new Date().getFullYear() + ' ' + p.brand.name}});
    p.pages.push({
      id: uid('page'), key: rawName, slug: slugify(rawName) || ('page' + p.pages.length),
      title: {en: title.slice(0,40), fa: title.slice(0,40)},
      sections: sections
    });
  }

  // assets
  const assetEntries = entries.filter(e => e.bytes && /\.(png|jpe?g|webp|gif|svg|woff2?)$/i.test(e.name))
                              .filter(e => e.bytes.length < 2.5 * 1024 * 1024)
                              .slice(0, 40);
  assetEntries.forEach(e => {
    p.assets.push({
      id: uid('as'), name: e.name.split('/').pop(),
      type: mimeFromName(e.name),
      dataUrl: bytesToDataUrl(e.bytes, mimeFromName(e.name)),
      size: e.bytes.length
    });
  });

  p.updatedAt = now();
  return p;
}

function importProjectJSON(text){
  const data = JSON.parse(text);
  if(!data || !data.pages) throw new Error('invalid-project');
  // normalize
  data.id = data.id || uid('proj');

function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function pickFile(accept, multiple){
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept || '';
    if(multiple) inp.multiple = true;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => {
      const files = Array.from(inp.files || []);
      document.body.removeChild(inp);
      resolve(multiple ? files : files[0] || null);
    });
    inp.click();
  });
}

function toast(msg, kind){
  const root = $('#toast');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.innerHTML = (kind === 'ok' ? '<svg class="s16" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'
                : kind === 'err' ? '<svg class="s16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>'
                : '') + '<span>' + esc(msg) + '</span>';
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
    setTimeout(() => el.remove(), 260);
  }, 2400);
}

let sheetEls = null;
function openSheet(opts){
  closeSheet();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.setAttribute('role','dialog');
  sheet.innerHTML =
    '<div class="sheet-grab"></div>' +
    '<div class="sheet-hdr">' +
      '<h3>' + esc(opts.title || '') + '</h3>' +
      '<button class="iconbtn" data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>' +
    '</div>' +
    '<div class="sheet-body"></div>' +
    (opts.footer ? '<div class="sheet-foot"></div>' : '');
  document.body.appendChild(scrim);
  document.body.appendChild(sheet);

  const body = $('.sheet-body', sheet);
  if(typeof opts.body === 'string') body.innerHTML = opts.body;
  else if(opts.body) body.appendChild(opts.body);

  if(opts.footer){
    const f = $('.sheet-foot', sheet);
    if(typeof opts.footer === 'string') f.innerHTML = opts.footer;
    else f.appendChild(opts.footer);
  }

  requestAnimationFrame(() => { scrim.classList.add('show'); sheet.classList.add('show'); });
  scrim.addEventListener('click', closeSheet);
  $('[data-x]', sheet).addEventListener('click', closeSheet);

  sheetEls = {scrim, sheet};
  if(opts.onMount) opts.onMount(sheet, body);
  return sheet;
}
function closeSheet(){
  if(!sheetEls) return;
  const {scrim, sheet} = sheetEls;
  sheetEls = null;
  sheet.classList.remove('show');
  scrim.classList.remove('show');
  setTimeout(() => { sheet.remove(); scrim.remove(); }, 320);
  if(State.sheet && State.sheet.onClose) State.sheet.onClose();
  State.sheet = null;
  if(State.screen === 'editor') renderEditorChrome();
}

/* ============================================================================
   HISTORY (undo / redo)
   ============================================================================ */
function snapshot(){
  if(!State.project) return null;
  return JSON.stringify(State.project);
}
function pushHistory(){
  if(!State.project) return;
  const snap = snapshot();
  if(State.history[State.histIndex] === snap) return;
  State.history = State.history.slice(0, State.histIndex + 1);
  State.history.push(snap);
  if(State.history.length > CONFIG.historyLimit) State.history.shift();
  State.histIndex = State.history.length - 1;
  updateUndoUI();
}
function undo(){
  if(State.histIndex <= 0) return;
  State.histIndex--;
  State.project = JSON.parse(State.history[State.histIndex]);
  State.selection = null;
  afterProjectChange();
  toast(t('ed.undo'));
}
function redo(){
  if(State.histIndex >= State.history.length - 1) return;
  State.histIndex++;
  State.project = JSON.parse(State.history[State.histIndex]);
  State.selection = null;
  afterProjectChange();
}
function updateUndoUI(){
  const u = $('[data-undo]'), r = $('[data-redo]');
  if(u) u.disabled = State.histIndex <= 0;
  if(r) r.disabled = State.histIndex >= State.history.length - 1;
}
function afterProjectChange(){
  saveProjectDebounced();
  renderEditorChrome();
  renderCanvas();
  updateUndoUI();
}

/* ============================================================================
   AUTOSAVE
   ============================================================================ */
const saveProjectDebounced = debounce(async function(){
  if(!State.project) return;
  State.project.updatedAt = now();
  setSaveStatus('saving');
  try{
    await DB.put(State.project);
    setSaveStatus('saved');
    // refresh project list cache
    const idx = State.projects.findIndex(x => x.id === State.project.id);
    if(idx >= 0) State.projects[idx] = State.project; else State.projects.push(State.project);
  }catch(e){
    setSaveStatus('error');
  }
}, 600);

function setSaveStatus(s){
  const el = $('[data-savestatus]');
  if(!el) return;
  if(s === 'saving') el.innerHTML = '<span class="spin" style="width:11px;height:11px;border-width:1.5px"></span>' + t('ed.saving');
  else if(s === 'saved') el.innerHTML = '<span class="dot-live"></span>' + t('ed.saved');
  else el.innerHTML = '<span style="color:var(--warn)">●</span>' + t('err.title');
}

function hslToHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = x => Math.round(255 * x).toString(16).padStart(2,'0');
  return '#' + to(f(0)) + to(f(8)) + to(f(4));
}

async function runGeneration(d){
  State.screen = 'generating';
  const app = $('#app');
  const steps = [
    ['Structure','ساختار'],
    ['Design','طراحی'],
    ['Pages','صفحات'],
    ['Responsive','واکنش‌گرا'],
    ['SEO','سئو'],
    ['Assets','دارایی‌ها']
  ];
  app.innerHTML = `
    <div class="screen active" id="gen">
      <div class="hdr"><div class="title" style="text-align:center">${esc(t('wiz.gen.generating'))}</div></div>
      <div class="scroll"><div class="wiz-body" style="padding-top:40px">
        <div style="display:flex;justify-content:center;margin-bottom:36px">
          <div class="spin" style="width:34px;height:34px;border-width:3px"></div>
        </div>
        <ul class="gen-list" id="gen-list">
          ${steps.map(([en,fa],i) => `<li data-i="${i}"><span class="gcheck"></span><span>${esc(UI_LANG==='fa'?fa:en)}</span></li>`).join('')}
        </ul>
      </div></div>
    </div>`;

  const items = $$('#gen-list li');
  const tick = (i) => {
    if(items[i]){
      items[i].classList.add('show','done');
      items[i].querySelector('.gcheck').textContent = '✓';
    }
  };

  try{
    // Real work, step by step. Each tick corresponds to actual construction.
    await sleep(90); tick(0);
    const proj = newProject(d);

    await sleep(60); tick(1);
    // apply style-derived tokens
    const st = STYLES[d.style] || STYLES.minimal;
    proj.settings.radius = st.radius;
    proj.settings.sectionSpace = st.space;

    await sleep(60); tick(2);
    // pages already built in newProject — verify integrity
    if(!proj.pages.length) throw new Error('no-pages');

    await sleep(60); tick(3);
    // responsive is baked into CSS (clamp/grid) — nothing to fake

    await sleep(60); tick(4);
    // SEO
    const kw = d.keyword || d.brandName || proj.name;
    const city = d.city || d.location || '';
    const country = d.country || '';
    proj.seo.title = (kw + (city ? ' — ' + city : '') + (proj.brand.name ? ' | ' + proj.brand.name : '')).slice(0, 65);
    proj.seo.description = (d.desc || (proj.brand.name + ' — ' + (UI_LANG==='fa'?'خدمات حرفه‌ای':'professional services') + (city ? ' ' + (UI_LANG==='fa'?'در ':'in ') + city : '') + '.')).slice(0, 158);
    proj.seo.h1 = proj.brand.name || kw;
    proj.seo.keyword = kw; proj.seo.city = city; proj.seo.country = country; proj.seo.category = d.category || '';
    proj.seo.schema = true;

    await sleep(60); tick(5);

    // Save
    State.project = proj;
    State.activePage = proj.pages[0].id;
    State.history = []; State.histIndex = -1;
    pushHistory();
    await DB.put(proj);
    State.projects.push(proj);

    await sleep(260);
    openEditor();
  }catch(e){
    friendlyError(e);
    renderHome();
  }
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function renderCanvas(keepScroll){

  const html = renderSite(p, {
    pageId: State.activePage,
    editable: !State.previewMode,
    exportMode: false
  });
  frame.onload = () => {
    setTimeout(() => {
      try{ frame.contentWindow.postMessage({type:'nk-scroll', y: scrollY}, '*'); }catch(e){}

function applyDevice(){
  const wrap = $('#ed-wrap');
  const canvas = $('#ed-canvas');
  if(!wrap || !canvas) return;
  const d = State.device;
  wrap.className = 'ed-frame-wrap' + (d === 'mobile' ? ' mobile' : d === 'tablet' ? ' tablet' : '');
  const availW = canvas.clientWidth;
  const availH = canvas.clientHeight;
  let targetW = d === 'mobile' ? 390 : d === 'tablet' ? 834 : availW;
  const scale = Math.min(1, (availW - (d === 'desktop' ? 0 : 20)) / targetW);
  wrap.style.width = targetW + 'px';
  wrap.style.height = (availH / scale) + 'px';
  wrap.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  wrap.style.transformOrigin = 'top center';
  wrap.style.marginInline = 'auto';
  wrap.style.maxHeight = 'none';
  if(d === 'desktop'){ wrap.style.height = availH + 'px'; wrap.style.width = '100%'; }
}

function bindEditorEvents(){
  const app = $('#app');
  app.addEventListener('click', async (e) => {
    if(e.target.closest('[data-exit]')){ closeSheet(); await saveNow(); renderHome(); return; }
    if(e.target.closest('[data-undo]')){ undo(); return; }
    if(e.target.closest('[data-redo]')){ redo(); return; }
    if(e.target.closest('[data-previewmode]')){
      State.previewMode = !State.previewMode;
      e.target.closest('button').classList.toggle('on', State.previewMode);
      State.selection = null;
      renderCanvas();
      renderSelectionBar();
      return;
    }
    const dk = e.target.closest('[data-dock]');
    if(dk){ openDockPanel(dk.getAttribute('data-dock')); return; }
  });
  window.addEventListener('resize', debounce(applyDevice, 120));
}

/* --- selection bar --- */
function renderSelectionBar(){
  const bar = $('#sel-bar');
  const tag = $('#sel-tag');
  if(!bar) return;
  const sel = State.selection;
  if(!sel || State.previewMode){
    bar.classList.remove('show');
    if(tag) tag.classList.remove('show');
    return;
  }
  const items = [];
  if(sel.kind === 'text'){
    items.push(['edit', t('common.edit'), 'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z']);
    items.push(['dupe', t('common.duplicate'), 'M9 9h10v10H9zM5 15H4V4h11v1']);
    items.push(['del', t('common.delete'), 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6']);
  } else if(sel.kind === 'image'){
    items.push(['edit', t('ed.image'), 'M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6']);
    items.push(['del', t('common.delete'), 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6']);
  } else {
    items.push(['up', t('common.up'), 'M12 19V5M5 12l7-7 7 7']);
    items.push(['down', t('common.down'), 'M12 5v14M19 12l-7 7-7-7']);
    items.push(['dupe', t('common.duplicate'), 'M9 9h10v10H9zM5 15H4V4h11v1']);
    items.push(['hide', t('common.hide'), 'M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7zM4 4l16 16']);
    items.push(['del', t('common.delete'), 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6']);
  }
  bar.innerHTML = items.map(([k,label,path]) =>
    `<button data-act="${k}" class="${k === 'del' ? 'danger' : ''}">
      <svg class="s16" viewBox="0 0 24 24"><path d="${path}"/></svg><span>${esc(label)}</span>
    </button>`).join('');
  bar.classList.add('show');

  bar.onclick = (e) => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    handleSelectionAction(b.getAttribute('data-act'));
  };
}

function handleSelectionAction(act){
  const p = State.project;
  const sel = State.selection;
  if(!sel) return;
  const page = p.pages.find(x => x.id === State.activePage);
  const idx = page ? page.sections.findIndex(s => s.id === sel.secId) : -1;
  if(idx < 0) return;

  if(sel.kind === 'section'){
    if(act === 'up' && idx > 0){
      const [s] = page.sections.splice(idx,1); page.sections.splice(idx-1,0,s);
    } else if(act === 'down' && idx < page.sections.length - 1){
      const [s] = page.sections.splice(idx,1); page.sections.splice(idx+1,0,s);
    } else if(act === 'dupe'){
      const copy = clone(page.sections[idx]); copy.id = uid('sec');
      page.sections.splice(idx+1, 0, copy);
    } else if(act === 'hide'){
      page.sections[idx].hidden = !page.sections[idx].hidden;
    } else if(act === 'del'){
      page.sections.splice(idx,1);
      State.selection = null;
    } else if(act === 'edit'){
      openSectionEditor(sel.secId);
      return;
    }
    pushHistory();
    afterProjectChange();
    renderSelectionBar();
    renderDock();
    return;
  }
  if(act === 'edit'){
    if(sel.kind === 'text') openTextEditor(sel.secId, sel.key);
    else if(sel.kind === 'image') openImageEditor(sel.secId, sel.key);
    return;
  }
  if(act === 'del'){
    setPath(page.sections[idx], sel.key, '');
    pushHistory(); afterProjectChange(); renderSelectionBar();
  }
  if(act === 'dupe'){
    // duplicate the nearest section (text/image duplication of a section clone)
    const copy = clone(page.sections[idx]); copy.id = uid('sec');
    page.sections.splice(idx+1, 0, copy);
    pushHistory(); afterProjectChange();
  }
}

/* --- inline editing --- */
function startInlineEdit(){
  const sel = State.selection;
  const frame = $('#ed-frame');
  if(!sel || !frame || sel.kind !== 'text') return;
  try{
    frame.contentWindow.postMessage({type:'nk-edit-inline', sec:sel.secId, key:sel.key, lang:State.project.settings.lang}, '*');
  }catch(e){}

/* --- message bus --- */
window.addEventListener('message', (ev) => {
  const d = ev.data || {};
  if(State.screen !== 'editor') return;
  if(d.type === 'nk-select'){
    State.selection = {secId:d.sec, key:d.key, kind:d.kind};
    renderSelectionBar();
    const tag = $('#sel-tag');
    if(tag && d.rect){
      const canvas = $('#ed-canvas');
      const cr = canvas.getBoundingClientRect();
      tag.textContent = d.kind === 'section' ? t('ed.section') : (d.kind === 'image' ? t('ed.image') : t('ed.text'));
      tag.style.insetInlineStart = (d.rect.x + cr.left - 0) + 'px';
      tag.style.top = Math.max(cr.top + d.rect.y, cr.top + 4) + 'px';
      tag.classList.add('show');
    }
  }
  if(d.type === 'nk-clear'){
    State.selection = null;
    renderSelectionBar();
  }
  if(d.type === 'nk-text'){
    const p = State.project;
    const page = p.pages.find(x => x.id === State.activePage);
    const sec = page && page.sections.find(s => s.id === d.sec);
    if(!sec) return;
    const cur = getPath(sec, d.key);
    if(cur && typeof cur === 'object' && !Array.isArray(cur)){
      cur[d.lang || p.settings.lang] = d.value;
    } else {
      setPath(sec, d.key, d.value);
    }
    pushHistory();
    saveProjectDebounced();
    renderCanvas(0);
    return;
  }
  if(d.type === 'nk-goto'){
    const pg = State.project.pages.find(x => x.id === d.page);
    if(pg){ State.activePage = pg.id; State.selection = null; renderCanvas(); renderSelectionBar(); }
  }
});

function renderPagesList(wrap){
  const p = State.project;
  wrap.innerHTML = p.pages.map((pg, i) => `
    <div class="list-item" draggable="true" data-pgid="${escAttr(pg.id)}" data-idx="${i}">
      <div style="width:38px;height:38px;border-radius:9px;flex-shrink:0;overflow:hidden;border:1px solid var(--border);background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:11px;font-weight:700">
        ${esc((pg.title.en || 'P').slice(0,2).toUpperCase())}
      </div>
      <div class="li-body">
        <div class="li-title">${esc(pg.title.en || pg.slug)}${pg.id === State.activePage ? ' <span class="pill" style="margin-inline-start:6px">' + esc(UI_LANG==='fa'?'فعال':'active') + '</span>' : ''}</div>
        <div class="li-sub">${esc(pg.slug)}.html · ${(pg.sections||[]).length} ${esc(t('ed.sections.n'))}</div>
      </div>
      <div class="li-actions">
        <button class="iconbtn" data-pgup="${i}" ${i===0?'disabled':''} aria-label="Up"><svg class="s16" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        <button class="iconbtn" data-pgdown="${i}" ${i===p.pages.length-1?'disabled':''} aria-label="Down"><svg class="s16" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
        <button class="iconbtn" data-pgedit="${i}" aria-label="Rename"><svg class="s16" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="iconbtn" data-pgdel="${i}" aria-label="Delete"><svg class="s16" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </div>
    </div>`).join('');

  wrap.onclick = (e) => {
    const p = State.project;
    const up = e.target.closest('[data-pgup]');
    const dn = e.target.closest('[data-pgdown]');
    const ed = e.target.closest('[data-pgedit]');
    const dl = e.target.closest('[data-pgdel]');
    const it = e.target.closest('[data-pgid]');
    if(up){ const i = +up.getAttribute('data-pgup'); const [x] = p.pages.splice(i,1); p.pages.splice(i-1,0,x); pushHistory(); afterProjectChange(); renderPagesList(wrap); return; }
    if(dn){ const i = +dn.getAttribute('data-pgdown'); const [x] = p.pages.splice(i,1); p.pages.splice(i+1,0,x); pushHistory(); afterProjectChange(); renderPagesList(wrap); return; }
    if(ed){
      const i = +ed.getAttribute('data-pgedit');
      const name = prompt(t('common.rename'), p.pages[i].title.en || '');
      if(name){
        p.pages[i].title.en = name;
        p.pages[i].title.fa = name;
        p.pages[i].slug = slugify(name) || p.pages[i].slug;
        pushHistory(); afterProjectChange(); renderPagesList(wrap);
      }
      return;
    }
    if(dl){
      const i = +dl.getAttribute('data-pgdel');
      if(p.pages.length <= 1){ toast(UI_LANG==='fa'?'حداقل یک صفحه لازم است':'At least one page is required','err'); return; }
      if(!confirm(t('common.delete') + ' — ' + (p.pages[i].title.en || ''))) return;
      const removed = p.pages.splice(i,1)[0];
      if(State.activePage === removed.id) State.activePage = p.pages[0].id;
      pushHistory(); afterProjectChange(); renderPagesList(wrap);
      return;
    }
    if(it && !e.target.closest('button')){
      State.activePage = it.getAttribute('data-pgid');
      State.selection = null;
      renderCanvas();
      renderSelectionBar();
      closeSheet();
    }
  };

  // drag & drop ordering
  let dragIdx = null;
  wrap.addEventListener('dragstart', (e) => {
    const it = e.target.closest('[data-pgid]');
    if(!it) return;
    dragIdx = +it.getAttribute('data-idx');
    it.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', String(dragIdx)); }catch(err){}
  });
  wrap.addEventListener('dragover', (e) => {
    e.preventDefault();
    const it = e.target.closest('[data-pgid]');
    $$('.list-item', wrap).forEach(x => x.classList.remove('over'));
    if(it) it.classList.add('over');
  });
  wrap.addEventListener('drop', (e) => {
    e.preventDefault();
    const it = e.target.closest('[data-pgid]');
    if(!it || dragIdx == null) return;
    const to = +it.getAttribute('data-idx');
    const p2 = State.project;
    const [x] = p2.pages.splice(dragIdx,1);
    p2.pages.splice(to,0,x);
    dragIdx = null;
    pushHistory(); afterProjectChange(); renderPagesList(wrap);
  });
  wrap.addEventListener('dragend', () => {
    $$('.list-item', wrap).forEach(x => { x.classList.remove('dragging','over'); });
  });

  // add page button
  const addBtn = document.querySelector('[data-addpage]');
  if(addBtn && !addBtn.dataset.bound){
    addBtn.dataset.bound = '1';
    addBtn.addEventListener('click', () => {
      const name = prompt(t('ed.addpage'), '');
      if(!name || !name.trim()) return;
      const nm = name.trim();
      const pg = {
        id: uid('page'), key: 'custom_' + slugify(nm), slug: slugify(nm),
        title: {en: nm, fa: nm},
        sections: [
          {id: uid('sec'), type:'pagehead', hidden:false, props:{title: nm, subtitle:''}},
          {id: uid('sec'), type:'cards', hidden:false, props:{title:'', items:[
            {title:'Item one', text:'Edit this content in the editor.'},
            {title:'Item two', text:'Everything here is editable.'}
          ]}},
          {id: uid('sec'), type:'footer', hidden:false, props:{text:'© ' + new Date().getFullYear() + ' ' + (State.project.brand.name || '')}}
        ]
      };
      State.project.pages.push(pg);
      pushHistory(); afterProjectChange(); renderPagesList(wrap);
    });
  }
}

    else if(dn){ const i = +dn.getAttribute('data-sdown'); const [x] = page.sections.splice(i,1); page.sections.splice(i+1,0,x); }
    else if(vis){ const i = +vis.getAttribute('data-svis'); page.sections[i].hidden = !page.sections[i].hidden; }
    else if(dup){ const i = +dup.getAttribute('data-sdup'); const c = clone(page.sections[i]); c.id = uid('sec'); page.sections.splice(i+1,0,c); }
    else if(del){
      const i = +del.getAttribute('data-sdel');
      if(page.sections.length <= 1){ toast(UI_LANG==='fa'?'حداقل یک بخش لازم است':'At least one section is required','err'); return; }
      page.sections.splice(i,1);
    }
    else return;
    pushHistory(); afterProjectChange(); renderSectionsList(wrap, page, root);
  };
}

      };

      $('#im-overlay', body).value = overlay;

      body.addEventListener('click', (e) => {

        $('#im-preview', body).src = resolveImg(newSrc, p);

          newSrc = 'asset:' + assetId;

        const dataUrl = await readAsDataURL(f);

        $('#im-preview', body).src = dataUrl;
        saveProjectDebounced();

      $('[data-save]', root).addEventListener('click', () => {
        setPath(sec, key, newSrc || '');
        setPath(sec, key + 'Alt', $('#im-alt', body).value);

          fit: fit, pos: pos,
          radius: +$('#im-radius', body).value,
          opacity: +$('#im-opacity', body).value,
          overlay: $('#im-overlay', body).value

        pushHistory(); afterProjectChange(); closeSheet();
      });
    }

}

        pushHistory(); afterProjectChange();
      });

/* --- ASSETS --- */
function openAssetsSheet(){
  const p = State.project;
  openSheet({
    title: t('assets.title'),
    body: `<div class="asset-grid" id="asset-grid"></div>
      <div class="divider"></div>
      <div class="muted" style="font-size:11.5px">JPG · PNG · WEBP · SVG · GIF · MP4 · WEBM · WOFF · WOFF2</div>`,
    footer: `<button class="btn block primary" data-upload>
      <svg class="s16" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>${esc(t('assets.upload'))}</button>`,
    onMount: (root, body) => {
      renderAssetGrid($('#asset-grid', body));
      $('[data-upload]', root).addEventListener('click', async () => {
        const files = await pickFile('image/*,video/*,.woff,.woff2,.svg', true);
        if(!files || !files.length) return;
        for(const f of files){
          if(f.size > 4 * 1024 * 1024){
            toast(f.name + ' — ' + (UI_LANG==='fa'?'حجم زیاد است':'too large'), 'err');
            continue;
          }
          try{
            const dataUrl = await readAsDataURL(f);
            p.assets.push({id: uid('as'), name: f.name, type: f.type || mimeFromName(f.name), dataUrl: dataUrl, size: f.size});
          }catch(e){}
        }
        saveProjectDebounced();
        renderAssetGrid($('#asset-grid', body));
        toast(t('ok.saved'), 'ok');
      });
    }
  });
}

function renderAssetGrid(grid){
  const p = State.project;
  if(!p.assets.length){
    grid.innerHTML = `<div style="grid-column:1/-1" class="muted" style="text-align:center;padding:20px 0">${esc(t('assets.empty'))}</div>`;
    return;
  }
  grid.innerHTML = p.assets.map((a, i) => {
    const isImg = (a.type || '').indexOf('image') === 0 || /\.(png|jpe?g|webp|gif|svg)$/i.test(a.name);
    return `<div class="asset" data-asset="${escAttr(a.id)}">
      ${isImg ? `<img src="${escAttr(a.dataUrl)}" alt="${escAttr(a.name)}" loading="lazy">`
              : `<span style="font-size:11px;color:var(--text-3);padding:8px;text-align:center;word-break:break-all">${esc(a.name)}</span>`}
      <span class="a-name">${esc(a.name)}</span>
      <button class="iconbtn" data-delasset="${i}" style="position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px">
        <svg class="s16" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>`;
  }).join('');
  grid.onclick = (e) => {
    const del = e.target.closest('[data-delasset]');
    if(del){
      e.stopPropagation();
      const i = +del.getAttribute('data-delasset');
      p.assets.splice(i,1);
      pushHistory(); saveProjectDebounced();
      renderAssetGrid(grid);
    }
  };
}

function openAssetPicker(cb){
  const p = State.project;
  if(!p.assets.length){
    toast(UI_LANG==='fa'?'ابتدا تصویری بارگذاری کنید':'Upload an image first');
    return;
  }
  openSheet({
    title: t('ed.chooseasset'),
    body: `<div class="asset-grid" id="pick-grid"></div>`,
    onMount: (root, body) => {
      const grid = $('#pick-grid', body);
      grid.innerHTML = p.assets.map(a => {
        const isImg = (a.type || '').indexOf('image') === 0 || /\.(png|jpe?g|webp|gif|svg)$/i.test(a.name);
        if(!isImg) return '';
        return `<button class="asset" data-pick="${escAttr(a.id)}">
          <img src="${escAttr(a.dataUrl)}" alt="${escAttr(a.name)}" loading="lazy">
          <span class="a-name">${esc(a.name)}</span>
        </button>`;
      }).join('');
      grid.onclick = (e) => {
        const b = e.target.closest('[data-pick]');
        if(!b) return;
        cb(b.getAttribute('data-pick'));
        closeSheet();
      };
    }
  });
}

function readAsDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

function seoRow(label, val, state){
  return `<div class="seo-row">
    <span class="seo-badge ${state}">${state === 'ok' ? '✓' : state === 'warn' ? '!' : '×'}</span>
    <span class="seo-lbl">${esc(label)}</span>
    <span class="seo-val">${esc(val)}</span>
  </div>`;
}
function countImages(p){
  let n = 0;
  p.pages.forEach(pg => pg.sections.forEach(s => {
    if(s.props && s.props.image) n++;
    if(s.props && Array.isArray(s.props.images)) n += s.props.images.length;
    if(s.props && Array.isArray(s.props.items)) s.props.items.forEach(it => { if(it.image) n++; });
  }));
  return n;
}
function countAlt(p){
  let n = 0;
  p.pages.forEach(pg => pg.sections.forEach(s => {
    if(s.props && s.props.image && getPath(s, 'props.imageAlt')) n++;
    if(s.props && Array.isArray(s.props.images)) s.props.images.forEach((im,i) => { if(getPath(s, 'props.imagesAlt.'+i)) n++; });
  }));
  return n;
}

document.addEventListener('keydown', (e) => {

  const meta = e.metaKey || e.ctrlKey;
  if(meta && e.key === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if(meta && (e.key === 'y' || (e.key === 'z' && e.shiftKey))){ e.preventDefault(); redo(); }
  else if(e.key === 'Escape'){ closeSheet(); }
  else if(e.key === 'Enter' && State.selection && State.selection.kind === 'text'){ startInlineEdit(); }
});

/* ============================================================================
   BOOT
   ============================================================================ */
async function boot(){
  loadPrefs();
  try{
    State.projects = await DB.all();
  }catch(e){ State.projects = []; }

  // If URL has ?p=<id>, open that project directly (handy for local use)
  const params = new URLSearchParams(location.search);
  const pid = params.get('p');
  if(pid){
    const found = State.projects.find(x => x.id === pid);
    if(found){ State.project = found; State.activePage = found.pages[0].id; pushHistory(); openEditor(); return; }
  }
  renderHome();
}

window.addEventListener('beforeunload', (e) => {
  if(State.screen === 'editor' && State.project){ saveNow(); }
});

boot();

})();
</script>
