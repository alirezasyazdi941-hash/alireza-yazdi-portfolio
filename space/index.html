<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NONONICK SPACE BASE · MISSION CONTROL</title>
<meta name="description" content="Nononick Space Base — mission-control hub for web, API, database, voice, document and research tools.">
<style>
@font-face{font-family:Unbounded;font-weight:200 900;font-display:swap;src:url(fonts/unbounded-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:100 800;font-display:swap;src:url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:Vazirmatn;font-weight:100 900;font-display:swap;src:url(fonts/vazirmatn-arabic-wght-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE80-FEFC}
@font-face{font-family:Vazirmatn;font-weight:100 900;font-display:swap;src:url(fonts/vazirmatn-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{
  --bg:#000;--p1:#05080b;--p2:#0a1016;--line:#16232b;--line2:#26404c;
  --tx:#dbe9ee;--mut:#6d8794;--ice:#8cf6ff;--amb:#ffb02e;--grn:#5dffb0;--red:#ff5a4d;--vio:#a58bff;
  --disp:Unbounded,Vazirmatn,system-ui,sans-serif;--body:Vazirmatn,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);line-height:1.8;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.scan{position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(140,246,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;opacity:.28;mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
a{color:inherit}
.wrap{position:relative;z-index:1;max-width:1240px;margin:auto;padding:0 20px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mono b{color:var(--ice);font-weight:600}
header{position:sticky;top:0;z-index:10;background:#000000e6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;padding:10px 0}
.brand{white-space:nowrap;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.08em;display:flex;align-items:center;gap:10px;direction:ltr}
.brand i{width:18px;height:18px;border:1.5px solid var(--ice);border-radius:50%;position:relative;display:inline-block}
.brand i::before{content:"";position:absolute;left:-5px;right:-5px;top:50%;height:1.5px;background:var(--ice);transform:rotate(-24deg)}
.sp{flex:1}
.chip{border:1px solid var(--line2);background:#000;color:var(--tx);border-radius:2px;padding:4px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;cursor:pointer;text-transform:uppercase}
.chip:hover{border-color:var(--ice);color:var(--ice)}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);margin-inline-end:6px;animation:bl 2s infinite}
@keyframes bl{50%{opacity:.35}}
/* corner-bracket panel */
.pn{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,#05080bcc,#000000cc)}
.pn::before,.pn::after{content:"";position:absolute;width:10px;height:10px;border:1.5px solid var(--ice);pointer-events:none}
.pn::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.pn::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.hero{display:grid;grid-template-columns:1fr minmax(320px,540px);gap:34px;align-items:center;min-height:calc(100vh - 62px);padding:34px 0 50px}
.kick{display:flex;gap:18px;flex-wrap:wrap}
h1{font-family:var(--disp);font-weight:800;line-height:.92;margin:14px 0 18px;font-size:clamp(44px,8.4vw,112px);letter-spacing:-.045em;direction:ltr;text-align:left}
h1 span{display:block}
h1 .o{color:var(--ice);text-shadow:0 0 40px rgba(140,246,255,.35)}
.lead{font-size:clamp(15px,1.5vw,18px);color:#b8cdd6;max-width:48ch}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:2px;padding:10px 20px;cursor:pointer;border:1px solid var(--line2);background:#000;color:var(--tx);text-decoration:none;display:inline-block}
.btn.p{background:var(--ice);color:#001014;border-color:var(--ice)}
.btn:hover{filter:brightness(1.15)}
.btn:focus-visible,.chip:focus-visible,.node:focus-visible,.bay:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.tele{display:grid;grid-template-columns:repeat(4,1fr);margin-top:26px;max-width:620px;direction:ltr}
.tele div{padding:10px 12px;border:1px solid var(--line);margin:0 -1px -1px 0}
.tele b{display:block;font-family:var(--mono);font-size:20px;color:var(--ice);font-weight:500;letter-spacing:.02em}
/* orbit display */
.orbit{position:relative;width:100%;aspect-ratio:1;margin:auto;padding:0}
.orbit svg{position:absolute;inset:0;width:100%;height:100%}
.core{position:absolute;left:50%;top:50%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#c9fcff,#2f6f8f 42%,#020b14 82%);box-shadow:0 0 70px rgba(140,246,255,.3),inset -8px -8px 20px #000c;display:grid;place-items:center}
.node{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--line2);background:#000d;color:var(--tx);border-radius:2px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;cursor:pointer;white-space:nowrap;direction:ltr}
.node::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c,var(--ice));margin-inline-end:7px;box-shadow:0 0 10px var(--c,var(--ice))}
.node:hover{border-color:var(--c,var(--ice));color:var(--c,var(--ice))}
.orbit .cap{position:absolute;left:8px;bottom:6px;direction:ltr}
.orbit .cap2{position:absolute;right:8px;top:6px;direction:ltr}
section{padding:64px 0}
h2{font-family:var(--disp);font-weight:700;font-size:clamp(20px,3vw,34px);margin:6px 0 8px;letter-spacing:-.02em;direction:ltr;text-align:start}
.sub{color:var(--mut);max-width:62ch;margin:0 0 28px}
.bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.bay{display:flex;flex-direction:column;text-align:start;gap:8px;padding:16px 18px 18px;cursor:pointer;font:inherit;color:var(--tx);transition:transform .18s,border-color .18s;border:1px solid var(--line);background:linear-gradient(180deg,#07101a99,#000)}
.bay:hover{transform:translateY(-3px);border-color:var(--c)}
.bay .row{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--mut);direction:ltr}
.bay .row i{font-style:normal;color:var(--c)}
.bay h3{margin:0;font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:-.01em;direction:ltr;text-align:start}
.bay p{margin:0;color:#aac0cb;font-size:14px;flex:1}
.bay .go{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--c);direction:ltr;text-align:start}
.bar{height:3px;background:var(--line);position:relative}
.bar::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w,70%);background:var(--c)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{padding:16px 18px}
.step b{font-family:var(--mono);font-size:26px;color:var(--amb);display:block;direction:ltr;text-align:start;font-weight:500}
footer{padding:36px 0 60px;color:var(--mut);font-size:13px;border-top:1px solid var(--line);position:relative;z-index:1}
#dock{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
#dock.on{display:flex}
.dbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line2);background:#03070a}
.dbar .t{font-family:var(--disp);font-weight:700;font-size:12px;direction:ltr;letter-spacing:.06em}
#frame{flex:1;border:0;width:100%;background:#000}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
@media(max-width:900px){.hero{grid-template-columns:1fr;min-height:0}.orbit{max-width:440px}}
@media(max-width:560px){.brand{font-size:10.5px}.top .hide-s{display:none}.tele{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.led{animation:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas><div class="grid"></div><div class="scan"></div>
<header><div class="wrap top">
  <div class="brand"><i></i>NONONICK · SPACE BASE</div><div class="sp"></div>
  <span class="mono hide-s"><span class="led"></span><b id="clock">--:--:--</b> UTC</span>

<main class="wrap">

<section id="bays" class="reveal">

</section>

<section class="reveal">
  <div class="mono">FLIGHT PLAN</div>
  <h2 data-i="growH"></h2>
  <p class="sub" data-i="growP"></p>
  <div class="pipe" id="pipe"></div>
</section>
</main>

<footer><div class="wrap" data-i="foot"></div></footer>

<div id="dock" role="dialog" aria-modal="true" aria-label="Dock">
  <div class="dbar">
    <button class="chip" id="back" data-i="back"></button>

  px+=(tx-px)*.05;py+=(ty-py)*.05;cx.clearRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){var s=stars[i];var x=((s.x*W+px*s.z*40*(W/1000))%W+W)%W,y=((s.y*H+py*s.z*40*(W/1000)+(reduce?0:ts*.003*s.z))%H+H)%H;
    var a=.3+.7*Math.abs(Math.sin(ts*.001+s.tw));if(reduce)a=.6;cx.fillStyle='rgba(210,235,255,'+(a*s.z).toFixed(2)+')';var r=s.z*1.5*(W/1400+.6);cx.fillRect(x,y,r,r);}
  requestAnimationFrame(sky);
}
addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;},{passive:true});
addEventListener('resize',size);
/* ---------- dock ---------- */
function openDock(id,noHash){
  var m=MODULES.filter(function(x){return x.id===id})[0];if(!m)return;
  $('#dtitle').textContent=m.name;$('#frame').src=m.file;$('#newtab').href=m.file;$('#dock').classList.add('on');
  document.body.style.overflow='hidden';if(!noHash)history.replaceState(null,'','#'+id);$('#back').focus();
}
function closeDock(){$('#dock').classList.remove('on');$('#frame').src='about:blank';document.body.style.overflow='';history.replaceState(null,'',location.pathname);}
$('#back').addEventListener('click',closeDock);
addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#dock').classList.contains('on'))closeDock();});
$('#random').addEventListener('click',function(){openDock(MODULES[Math.floor(Math.random()*MODULES.length)].id);});
$('#lang').addEventListener('click',function(){lang=lang==='fa'?'en':'fa';try{localStorage.setItem('nn-space-lang',lang);}catch(e){}apply();});
/* ---------- clocks: UTC, Mission Elapsed Time (since 2026-11-01), Tehran ---------- */
var T0=Date.UTC(2026,10,1,0,0,0);
function p2(n){return String(n).padStart(2,'0')}
function clock(){
  var d=new Date();$('#clock').textContent=p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds());
  var s=Math.max(0,Math.floor((d-T0)/1000)),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
  $('#met').textContent=String(dd).padStart(3,'0')+':'+p2(hh)+':'+p2(mm)+':'+p2(ss);
  var th=new Date(d.getTime()+3.5*3600000);$('#tTeh').textContent=p2(th.getUTCHours())+':'+p2(th.getUTCMinutes());
}
setInterval(clock,1000);clock();
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.1}):null;
document.querySelectorAll('.reveal').forEach(function(e){io?io.observe(e):e.classList.add('in')});
ticks();apply();size();requestAnimationFrame(tick);requestAnimationFrame(sky);
if(location.hash.length>1)openDock(location.hash.slice(1),true);
addEventListener('hashchange',function(){if(location.hash.length>1)openDock(location.hash.slice(1),true);});
</script>
