<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Global Voice">
<meta name="description" content="NONONICK GLOBAL VOICE — a premium cloud communications workspace for virtual numbers, calls, SMS, voicemail and routing.">
<title>NONONICK GLOBAL VOICE</title>
<style>
/* =========================================================
   THEME TOKENS
   ========================================================= */
:root{
  --bg:#05070c; --bg2:#080b12;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.075);
  --panel3:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.09);
  --border2:rgba(255,255,255,.17);
  --txt:#eaf0fa; --txt2:#98a4bb; --txt3:#5d6980;
  --cyan:#22d3ee; --blue:#3b82f6; --violet:#a855f7;
  --green:#34d399; --red:#fb7185; --amber:#fbbf24;
  --grad:linear-gradient(135deg,#22d3ee,#3b82f6 48%,#a855f7);
  --grad-soft:linear-gradient(135deg,rgba(34,211,238,.18),rgba(59,130,246,.14) 48%,rgba(168,85,247,.18));
  --r:20px; --r-sm:14px; --r-xs:10px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --shadow:0 20px 44px -20px rgba(0,0,0,.92);
  --glow:0 0 0 1px rgba(34,211,238,.25), 0 10px 34px -12px rgba(34,211,238,.45);
}
[data-theme="light"]{
  --bg:#f2f5fb; --bg2:#e9eef8;
  --panel:rgba(255,255,255,.78);
  --panel2:rgba(255,255,255,.94);
  --panel3:rgba(255,255,255,1);
  --border:rgba(12,22,44,.09);
  --border2:rgba(12,22,44,.18);
  --txt:#0a1120; --txt2:#4d5b78; --txt3:#8794ad;
  --shadow:0 20px 44px -26px rgba(20,30,60,.4);
}

/* =========================================================
   BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:var(--bg); color:var(--txt);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
  line-height:1.45;
  font-size:15px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(34,211,238,.15), transparent 62%),
    radial-gradient(760px 520px at 102% 2%, rgba(168,85,247,.13), transparent 62%),
    radial-gradient(900px 620px at 50% 112%, rgba(59,130,246,.11), transparent 62%);
}
[data-theme="light"] body::before{opacity:.45}
button,input,textarea,select{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}
a{color:var(--cyan);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px}
::selection{background:rgba(34,211,238,.3)}
input,textarea{outline:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}

/* =========================================================
   APP SHELL
   ========================================================= */
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
main{
  flex:1;width:100%;max-width:860px;margin:0 auto;
  padding:0 14px calc(132px + var(--safe-b));
  padding-left:calc(14px + var(--safe-l));
  padding-right:calc(14px + var(--safe-r));
}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) 14px 10px;
  padding-left:calc(14px + var(--safe-l));
  padding-right:calc(14px + var(--safe-r));
  background:linear-gradient(180deg,rgba(5,7,12,.94) 0%,rgba(5,7,12,.72) 62%,rgba(5,7,12,0) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  backdrop-filter:blur(22px) saturate(170%);
}
[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(242,245,251,.96) 0%,rgba(242,245,251,.72) 62%,rgba(242,245,251,0) 100%)}
.tb-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tb-title{font-size:20px;font-weight:750;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11.5px;color:var(--txt3);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:5px}
.icon-btn{
  width:40px;height:40px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;
  color:var(--txt2);background:var(--panel);border:1px solid var(--border);
  transition:transform .16s cubic-bezier(.2,.8,.3,1), background .2s, color .2s;
}
.icon-btn:active{transform:scale(.9);background:var(--panel2)}
.icon-btn.badge{position:relative}
.icon-btn.badge::after{
  content:attr(data-count);position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--red);color:#160409;font-size:10px;font-weight:800;
  display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);
}
.icon-btn svg{width:20px;height:20px}

/* MODE PILL */
.mode-pill{
  display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--border2);
  background:var(--panel2);color:var(--txt2);
}
.mode-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.mode-pill.connected .dot{background:var(--green);box-shadow:0 0 8px var(--green)}

/* TABBAR */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  padding:6px 8px calc(6px + var(--safe-b));
  padding-left:calc(8px + var(--safe-l));
  padding-right:calc(8px + var(--safe-r));
  background:linear-gradient(0deg,rgba(5,7,12,.985) 0%,rgba(5,7,12,.86) 58%,rgba(5,7,12,0) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  backdrop-filter:blur(26px) saturate(170%);
}
[data-theme="light"] .tabbar{background:linear-gradient(0deg,rgba(242,245,251,.99) 0%,rgba(242,245,251,.88) 58%,rgba(242,245,251,0) 100%)}
.tabs{display:flex;max-width:520px;margin:0 auto;align-items:center}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;
  color:var(--txt3);font-size:9.5px;font-weight:700;letter-spacing:.02em;border-radius:14px;
  transition:color .2s, transform .16s;
}
.tab:active{transform:scale(.93)}
.tab .tab-ic{display:grid;place-items:center;height:24px;transition:transform .22s cubic-bezier(.2,.9,.3,1)}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--txt)}
.tab.active .tab-ic{color:var(--cyan);transform:translateY(-1px);filter:drop-shadow(0 0 9px rgba(34,211,238,.7))}
.tab .tab-dot{position:absolute;top:4px;margin-left:16px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}

/* FAB */
.fab{
  position:fixed;right:calc(16px + var(--safe-r));bottom:calc(86px + var(--safe-b));z-index:75;
  width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:#04141c;
  background:var(--grad);border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 32px -8px rgba(34,211,238,.5), 0 6px 16px rgba(0,0,0,.5);
  transition:transform .18s cubic-bezier(.2,.9,.3,1), opacity .2s, box-shadow .2s;
}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px}
.fab.hidden{opacity:0;pointer-events:none;transform:scale(.6)}

/* =========================================================
   PRIMITIVES
   ========================================================= */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:var(--shadow);
}
.card.tight{padding:12px}
.card.flat{box-shadow:none}
.card.glow{border-color:rgba(34,211,238,.24)}
.card.glow::after{
  content:'';position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:var(--grad-soft);opacity:.55;z-index:-1;
}
.section{margin-top:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.section-title{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3)}
.section-link{font-size:12.5px;font-weight:700;color:var(--cyan)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  background:var(--panel2);border:1px solid var(--border);color:var(--txt);
  transition:transform .15s cubic-bezier(.2,.9,.3,1), background .2s, opacity .2s;
  min-height:46px;
}
.btn:active{transform:scale(.965)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--grad);color:#04141c;border-color:rgba(255,255,255,.2);box-shadow:0 10px 26px -10px rgba(34,211,238,.6)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.35);color:#ffb0bd}
.btn.full{width:100%}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px;border-radius:11px}
.btn[disabled]{opacity:.42;pointer-events:none}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--border);font-size:13px;font-weight:650;color:var(--txt2);
  white-space:nowrap;transition:.18s;
}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--grad);color:#04141c;border-color:transparent;box-shadow:0 8px 20px -10px rgba(34,211,238,.7)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}

.input{
  width:100%;padding:13px 15px;border-radius:14px;background:var(--panel);
  border:1px solid var(--border);color:var(--txt);font-size:15px;transition:border-color .2s, background .2s;
}
.input:focus{border-color:rgba(34,211,238,.5);background:var(--panel2)}
.input::placeholder{color:var(--txt3)}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3)}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--txt3);pointer-events:none}
.search-wrap .input{padding-left:42px}

.avatar{
  width:46px;height:46px;flex:0 0 auto;border-radius:15px;display:grid;place-items:center;
  font-weight:800;font-size:16px;letter-spacing:-.02em;color:#04141c;
  background:var(--grad);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.avatar.sm{width:36px;height:36px;border-radius:12px;font-size:13px}
.avatar.lg{width:68px;height:68px;border-radius:22px;font-size:24px}
.avatar.round{border-radius:50%}

.row{
  display:flex;align-items:center;gap:12px;padding:12px 4px;
  transition:background .18s, transform .14s;
}
.row.tappable:active{background:var(--panel);transform:scale(.985)}
.row + .row{border-top:1px solid var(--border)}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.row-sub{font-size:12.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-meta{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row-time{font-size:11.5px;color:var(--txt3);font-weight:600}

.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:var(--panel2);border:1px solid var(--border);color:var(--txt2);
}
.badge.green{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.32);color:#7ef0c2}
.badge.red{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.32);color:#ffb0bd}
.badge.amber{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.32);color:#ffd77a}
.badge.cyan{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.32);color:#8ee9fb}
.badge.violet{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.34);color:#d8b4fe}
.badge.grey{color:var(--txt3)}

.unread-dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.8);flex:0 0 auto}
.count-pill{
  min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--grad);color:#04141c;
  font-size:11.5px;font-weight:800;display:grid;place-items:center;
}

.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}

.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:13px 12px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;
  transition:transform .16s;
}
.stat:active{transform:scale(.975)}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.045em;line-height:1.1}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3)}
.stat .ic{position:absolute;top:10px;right:10px;opacity:.3}
.stat .ic svg{width:16px;height:16px}

.quick-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qa{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:var(--r-sm);
  background:var(--panel);border:1px solid var(--border);transition:transform .16s, background .2s;
}
.qa:active{transform:scale(.94);background:var(--panel2)}
.qa .qa-ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);color:var(--cyan);border:1px solid var(--border)}
.qa .qa-ic svg{width:19px;height:19px}
.qa span{font-size:9.8px;font-weight:700;color:var(--txt2);text-align:center;letter-spacing:.01em;line-height:1.2}

.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{
  display:flex;align-items:center;gap:12px;padding:15px;border-radius:var(--r-sm);
  background:var(--panel);border:1px solid var(--border);transition:transform .16s, background .2s;
}
.tile:active{transform:scale(.97);background:var(--panel2)}
.tile .t-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);color:var(--cyan);border:1px solid var(--border);flex:0 0 auto}
.tile .t-ic svg{width:20px;height:20px}
.tile .t-txt{min-width:0}
.tile .t-txt b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.tile .t-txt small{font-size:11px;color:var(--txt3)}

.empty{
  text-align:center;padding:44px 20px;color:var(--txt3);
}
.empty .e-ic{
  width:64px;height:64px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--border);color:var(--txt3);
}
.empty .e-ic svg{width:28px;height:28px}
.empty b{display:block;color:var(--txt2);font-size:15px;margin-bottom:4px}
.empty p{margin:0;font-size:13px;line-height:1.5}

.divider{height:1px;background:var(--border);margin:14px 0}

.skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-row{display:flex;gap:12px;align-items:center;padding:12px 0}
.sk-circle{width:46px;height:46px;border-radius:15px}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:8px}
.sk-line{height:11px;border-radius:6px}
.sk-line.w60{width:60%}
.sk-line.w35{width:35%}

/* =========================================================
   HERO NUMBER CARD
   ========================================================= */
.hero{
  border-radius:26px;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(34,211,238,.14),rgba(59,130,246,.07) 45%,rgba(168,85,247,.14));
  border:1px solid var(--border2);
  box-shadow:0 24px 50px -26px rgba(34,211,238,.5), var(--shadow);
}
.hero::before{
  content:'';position:absolute;top:-60%;right:-20%;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.3),transparent 70%);filter:blur(20px);pointer-events:none;
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative}
.hero-label{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--txt2)}
.hero-num{font-size:27px;font-weight:800;letter-spacing:-.035em;margin-top:6px;font-variant-numeric:tabular-nums}
.hero-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.hero-actions{display:flex;gap:9px;margin-top:18px;position:relative}
.hero-actions .btn{flex:1}

.flag{font-size:19px;line-height:1}

/* =========================================================
   USAGE BARS
   ========================================================= */
.usage-row{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.usage-row:last-child{margin-bottom:0}
.usage-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:650}
.usage-head span:last-child{color:var(--txt3);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.bar.warn > i{background:linear-gradient(90deg,#fbbf24,#fb7185)}

/* =========================================================
   CALL LIST
   ========================================================= */
.call-type-ic{
  width:18px;height:18px;display:grid;place-items:center;border-radius:6px;flex:0 0 auto;
}
.call-type-ic svg{width:13px;height:13px}
.ct-incoming{color:#7ef0c2}
.ct-outgoing{color:#8ee9fb}
.ct-missed{color:#ffb0bd}
.ct-voicemail{color:#d8b4fe}

/* =========================================================
   DIALER
   ========================================================= */
.dialer{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.dial-display{
  font-size:34px;font-weight:750;letter-spacing:-.02em;min-height:48px;
  font-variant-numeric:tabular-nums;text-align:center;word-break:break-all;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:transform .2s;
}
.dial-display.pop{transform:scale(1.03)}
.dial-sub{font-size:12.5px;color:var(--txt3);height:18px;margin-bottom:18px;font-weight:600}
.dialpad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:300px;margin:0 auto}
.dkey{
  aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--border);color:var(--txt);
  font-size:26px;font-weight:600;letter-spacing:-.02em;
  transition:transform .12s cubic-bezier(.2,.9,.3,1), background .16s;
  -webkit-user-select:none;user-select:none;
}
.dkey small{font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--txt3);margin-top:1px}
.dkey:active{transform:scale(.9);background:var(--panel3)}
.dial-actions{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:26px}

/* =========================================================
   MESSAGES
   ========================================================= */
.thread{
  display:flex;flex-direction:column;gap:9px;padding:6px 2px 10px;
}
.bubble{
  max-width:80%;padding:11px 14px;border-radius:19px;font-size:14.6px;line-height:1.45;
  position:relative;word-wrap:break-word;animation:pop .26s cubic-bezier(.2,.9,.3,1);
}

   NONONICK GLOBAL VOICE
   A single-file cloud communications workspace (DEMO MODE by default).

   ARCHITECTURE OVERVIEW
   ---------------------
   CONFIG      -> app constants
   UTILS       -> dom/format/icons/i18n helpers
   STORAGE     -> localStorage persistence layer
   SEED        -> realistic demo dataset generator
   STATE       -> in-memory application state + mutations
   PROVIDERS   -> TelephonyProvider / SMSProvider / NumberProvider /
                  VoicemailProvider interfaces + Demo implementations
   SCREENS     -> pure render functions returning {title, html, mount}
   ROUTER      -> navigation stack + render loop
   UI          -> sheets, toasts, overlays, event delegation

   Replacing DemoXProvider with a real provider requires NO UI changes.

   CONFIG
   ========================================================================= */

  APP: 'NONONICK GLOBAL VOICE',
  SHORT: 'Global Voice',
  VERSION: '1.0.0',
  STORAGE_KEY: 'nngv.state.v1',

};

   UTILITIES
   ========================================================================= */

const $$ = (sel, root = document) => Array.prototype.slice.call(root.querySelectorAll(sel));

const uid = (p) => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* --- deterministic pseudo random for demo data --- */
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  };
}

/* --- date/time --- */
const MIN = 60000, HOUR = 3600000, DAY = 86400000;

function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
function fmtDate(ts) {
  const d = new Date(ts), now = new Date();
  const diff = startOfDay(now.getTime()) - startOfDay(ts);
  if (diff === 0) return t('today');
  if (diff === DAY) return t('yesterday');
  if (diff < 7 * DAY) return d.toLocaleDateString(undefined, { weekday: 'short' });

}
function fmtDateTime(ts) {
  return fmtDate(ts) + ' · ' + fmtTime(ts);
}
function fmtRel(ts) {
  const diff = Date.now() - ts;
  if (diff < MIN) return t('now');
  if (diff < HOUR) return Math.floor(diff / MIN) + 'm';
  if (diff < DAY) return Math.floor(diff / HOUR) + 'h';
  if (diff < 7 * DAY) return Math.floor(diff / DAY) + 'd';
  return fmtDate(ts);
}
function fmtDur(sec) {
  if (!sec) return '0:00';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function fmtDurLong(sec) {
  if (!sec) return '—';
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m === 0) return s + 's';
  return m + 'm ' + s + 's';
}
function fmtNumber(n) {
  if (!n) return '';
  return n;
}

/* --- clipboard --- */
async function copyText(text) {
  try {
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
    } catch (e) { /* fall through to legacy path */ }
    if (!ok) {
      const ta = document.createElement('textarea');

      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
    }
    if (!ok) throw new Error('copy');
    toast(t('copied'), 'ok');
  } catch (e) {
    toast(t('copyFailed'), 'err');
  }
}

/* --- share --- */
async function shareText(text, title) {
  if (navigator.share) {
    try { await navigator.share({ title: title || CONFIG.APP, text: text }); }
    catch (e) { /* user cancelled — no error toast */ }
  } else {
    copyText(text);
  }

/* --- device integrations --- */
function deviceDial(number) {
  const clean = String(number).replace(/[^\d+*#]/g, '');
  try {
    const a = document.createElement('a');
    a.href = 'tel:' + clean;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast(t('dialerHandoff'), 'info');

    toast(t('dialerUnsupported'), 'warn');

  const clean = String(number).replace(/[^\d+*#]/g, '');

  try {
    window.location.href = url;
    toast(t('smsHandoff'), 'info');
  } catch (e) {
    toast(t('smsUnsupported'), 'warn');
  }

const State = {
  d: null,
  route: { name: 'home', params: {} },
  stack: [],
  ui: { dial: '', callFilter: 'all', callQuery: '', msgQuery: '', contactQuery: '', tplQuery: '', vmFilter: 'all', numberQuery: '', numberCountry: 'all', activeTab: 'home', tabCache: {} },
  persisted: false,

  init: function () {
    const loaded = Store.load();
    if (loaded && loaded.version === 1 && Array.isArray(loaded.numbers)) {
      this.d = loaded;
    } else {
      this.d = seedData();
    }
    // merge any missing keys safely
    const base = seedData();
    Object.keys(base).forEach(function (k) {
      if (State.d[k] === undefined) State.d[k] = base[k];
    });
    LANG = this.d.settings.lang || 'en';
    this.persist();
  },

  persist: function () { Store.save(this.d); },

  reset: function () {
    this.d = seedData();
    LANG = this.d.settings.lang || 'en';
    this.persist();
  },

  /* ---- lookups ---- */
  contact: function (id) { return this.d.contacts.find(function (c) { return c.id === id; }); },
  number: function (id) { return this.d.numbers.find(function (n) { return n.id === id; }); },
  conversation: function (id) { return this.d.conversations.find(function (c) { return c.id === id; }); },
  template: function (id) { return this.d.templates.find(function (x) { return x.id === id; }); },

  /* ---- mutations ---- */
  addCall: function (call) { this.d.calls.unshift(call); this.persist(); },

  deleteCall: function (id) {
    this.d.calls = this.d.calls.filter(function (c) { return c.id !== id; });
    this.persist();
  },

  unreadCount: function () {
    return this.d.conversations.reduce(function (a, c) { return a + (c.unread || 0); }, 0);
  },
  notificationCount: function () {
    return this.d.notifications.filter(function (n) { return !n.read; }).length;
  },

  addNotification: function (type, title, body) {
    this.d.notifications.unshift({ id: uid('n'), type: type, title: title, body: body, ts: Date.now(), read: false });
    if (this.d.notifications.length > 60) this.d.notifications.length = 60;
    this.persist();
  },

  isBlocked: function (number) {
    return this.d.blocked.indexOf(number) !== -1;
  }
};

   ========================================================================= */
function toast(message, kind) {
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'info');
  const iconName = kind === 'ok' ? 'check' : kind === 'err' ? 'alert' : kind === 'warn' ? 'alert' : 'info';
  el.innerHTML = ic(iconName, 17) + '<span>' + esc(message) + '</span>';
  root.appendChild(el);
  requestAnimationFrame(function () { el.classList.add('in'); });
  setTimeout(function () {
    el.classList.remove('in');
    setTimeout(function () { el.remove(); }, 320);
  }, 2900);
}

let sheetOpen = false;
function openSheet(html, opts) {
  opts = opts || {};
  const root = $('#sheet-root');
  root.innerHTML =
    '<div class="sheet-scrim" data-act="close-sheet"></div>' +
    '<div class="sheet" role="dialog" aria-modal="true">' +
      '<div class="sheet-grab"></div>' +
      (opts.title ? '<div class="sheet-head"><h3>' + esc(opts.title) + '</h3>' +
        '<button class="icon-btn" data-act="close-sheet" aria-label="' + esc(t('close')) + '">' + ic('x', 18) + '</button></div>' : '') +
      '<div class="sheet-body">' + html + '</div>' +
    '</div>';
  requestAnimationFrame(function () { root.classList.add('open'); });
  sheetOpen = true;
  const first = root.querySelector('input, textarea');
  if (first && !opts.noFocus) setTimeout(function () { try { first.focus(); } catch (e) {} }, 380);
}

function closeSheet() {
  const root = $('#sheet-root');
  root.classList.remove('open');
  sheetOpen = false;
  setTimeout(function () { if (!sheetOpen) root.innerHTML = ''; }, 340);
}

function confirmSheet(title, body, confirmLabel, onConfirm, danger) {
  const html =
    '<div class="notice">' + esc(body) + '</div>' +
    '<div style="display:flex;gap:10px;margin-top:6px">' +
      '<button class="btn ghost full" data-act="close-sheet">' + esc(t('cancel')) + '</button>' +
      '<button class="btn ' + (danger ? 'danger' : 'primary') + ' full" id="confirm-btn">' + esc(confirmLabel || t('confirm')) + '</button>' +
    '</div>';
  openSheet(html, { title: title });
  const btn = $('#confirm-btn');
  if (btn) {
    btn.addEventListener('click', function () {
      closeSheet();
      setTimeout(function () { onConfirm(); }, 200);
    }, { once: true });
  }
}

/* ---------- demo call overlay ---------- */
const CallUI = {
  timer: null,
  seconds: 0,
  muted: false,
  active: false,
  start: function (name, number) {
    this.active = true;
    this.seconds = 0;
    this.muted = false;
    const initials = (name || number || '?').trim().charAt(0).toUpperCase();
    $('#co-avatar').textContent = initials;
    $('#co-name').textContent = name || number;
    $('#co-num').textContent = number;
    $('#co-timer').textContent = 'DEMO · 00:00';
    $('#co-mute').classList.remove('on');
    $('#call-overlay').classList.add('show');
    const self = this;
    this.timer = setInterval(function () {
      self.seconds++;
      $('#co-timer').textContent = 'DEMO · ' + fmtDur(self.seconds);
    }, 1000);
    haptic(20);
  },
  end: function () {
    if (!this.active) return;
    this.active = false;
    clearInterval(this.timer);
    this.timer = null;
    $('#call-overlay').classList.remove('show');
    const dur = this.seconds;
    // Record the demo call in local history, honestly marked.
    State.addCall({
      id: uid('call'),
      contactId: null,
      name: $('#co-name').textContent,
      number: $('#co-num').textContent,
      numberId: (State.d.numbers[0] || {}).id || null,
      type: 'outgoing',
      ts: Date.now(),
      duration: dur,
      demo: true
    });
    State.addNotification('call', 'Demo call ended', $('#co-name').textContent + ' · ' + fmtDur(dur));
    toast(t('demoCallEnded') + ' · ' + fmtDur(dur), 'info');
    render();
  },
  toggleMute: function () {
    this.muted = !this.muted;
    $('#co-mute').classList.toggle('on', this.muted);
    haptic();
  },
  keypad: function () {
    toast('Keypad input is not transmitted in demo mode.', 'info');
  }
};

function avatarHTML(name, opts) {
  opts = opts || {};
  const initials = String(name || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase() || '?';
  const idx = opts.index !== undefined ? opts.index : (initials.charCodeAt(0) || 65) % AVATAR_GRADIENTS.length;
  const cls = 'avatar' + (opts.sm ? ' sm' : '') + (opts.lg ? ' lg' : '') + (opts.round ? ' round' : '');
  return '<div class="' + cls + '" style="background:' + AVATAR_GRADIENTS[idx % AVATAR_GRADIENTS.length] + '">' + esc(initials) + '</div>';
}

function callTypeMeta(type) {
  if (type === 'incoming') return { icon: 'phoneIn', cls: 'ct-incoming', label: t('incoming') };
  if (type === 'outgoing') return { icon: 'phoneOut', cls: 'ct-outgoing', label: t('outgoing') };
  if (type === 'missed') return { icon: 'phoneMissed', cls: 'ct-missed', label: t('missed') };
  return { icon: 'voicemail', cls: 'ct-voicemail', label: t('voicemail') };
}

/* =========================================================================
   CHARTS (vanilla SVG)
   ========================================================================= */
function barChartSVG(data, opts) {
  opts = opts || {};
  const w = opts.w || 340, h = opts.h || 120;
  const padB = 20, padT = 14;
  const max = Math.max(1, Math.max.apply(null, data.map(function (d) { return d.v; })));
  const n = data.length || 1;
  const gap = 6;
  const bw = (w - gap * (n - 1)) / n;
  let bars = '';
  data.forEach(function (d, i) {
    const bh = Math.max(3, ((h - padB - padT) * d.v) / max);
    const x = i * (bw + gap);
    const y = h - padB - bh;
    const isToday = i === data.length - 1;
    bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) +
      '" rx="' + Math.min(7, bw / 2).toFixed(1) + '" fill="' + (isToday ? 'url(#bg1)' : 'rgba(255,255,255,.16)') + '"/>' +
      '<text class="chart-tip" x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 5) + '" text-anchor="middle">' + esc(d.l) + '</text>';
  });
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs>' +
    bars + '</svg>';
}

function donutSVG(parts, opts) {
  opts = opts || {};
  const size = opts.size || 140;
  const R = 54, C = 2 * Math.PI * R;
  const total = parts.reduce(function (a, p) { return a + p.v; }, 0) || 1;
  let acc = 0;
  let segs = '';
  parts.forEach(function (p) {
    const len = (C * p.v) / total;
    if (len <= 0) return;
    segs += '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + p.color + '" stroke-width="15" ' +
      'stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" ' +
      'stroke-dashoffset="' + (-acc).toFixed(2) + '" stroke-linecap="butt" transform="rotate(-90 70 70)"/>';
    acc += len;
  });
  return '<svg viewBox="0 0 140 140" width="' + size + '" height="' + size + '">' +
    '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="15"/>' +
    segs +
    '<text x="70" y="66" text-anchor="middle" fill="currentColor" font-size="22" font-weight="800">' + total + '</text>' +
    '<text x="70" y="84" text-anchor="middle" fill="currentColor" font-size="9.5" font-weight="700" opacity=".55" letter-spacing="1">TOTAL</text>' +
    '</svg>';
}

function sparklineSVG(values, opts) {
  opts = opts || {};
  const w = 200, h = 46;
  const max = Math.max(1, Math.max.apply(null, values));
  const step = w / Math.max(1, values.length - 1);
  const pts = values.map(function (v, i) {
    return [(i * step).toFixed(1), (h - 4 - (v / max) * (h - 10)).toFixed(1)];
  });
  const d = pts.map(function (p, i) { return (i === 0 ? 'M' : 'L') + p[0] + ' ' + p[1]; }).join(' ');
  const area = d + ' L' + w + ' ' + h + ' L0 ' + h + ' Z';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="sg' + (opts.id || '1') + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + (opts.color || '#22d3ee') + '" stop-opacity=".38"/>' +
    '<stop offset="100%" stop-color="' + (opts.color || '#22d3ee') + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#sg' + (opts.id || '1') + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="' + (opts.color || '#22d3ee') + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';
}

/* =========================================================================
   ANALYTICS HELPERS
   ========================================================================= */
function analyticsData() {
  const calls = State.d.calls;
  const now = Date.now();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const dayStart = startOfDay(now - i * DAY);
    const dayEnd = dayStart + DAY;
    const v = calls.filter(function (c) { return c.ts >= dayStart && c.ts < dayEnd; }).length;
    days.push({ l: new Date(dayStart).toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2), v: v });
  }
  const answered = calls.filter(function (c) { return c.type === 'incoming' || c.type === 'outgoing'; }).length;
  const total = calls.length || 1;
  const avg = (function () {
    const withDur = calls.filter(function (c) { return c.duration > 0; });
    if (!withDur.length) return 0;
    return Math.round(withDur.reduce(function (a, c) { return a + c.duration; }, 0) / withDur.length);
  })();
  return {
    days: days,
    byType: [
      { label: t('incoming'), v: calls.filter(function (c) { return c.type === 'incoming'; }).length, color: '#34d399' },
      { label: t('outgoing'), v: calls.filter(function (c) { return c.type === 'outgoing'; }).length, color: '#22d3ee' },
      { label: t('missed'), v: calls.filter(function (c) { return c.type === 'missed'; }).length, color: '#fb7185' },
      { label: t('voicemail'), v: calls.filter(function (c) { return c.type === 'voicemail'; }).length, color: '#a855f7' }
    ],
    avgDuration: avg,
    responseRate: Math.round((answered / total) * 100)
  };
}

SCREENS.conversation = function (params) {
  const conv = State.conversation(params.id);
  if (!conv) return { title: t('messages'), html: emptyHTML('message', t('empty'), '') };
  if (conv.unread) { conv.unread = 0; State.persist(); }

  const bubbles = conv.messages.map(function (m) {
    const isOut = m.dir === 'out';
    return '<div class="bubble ' + (isOut ? 'out' : 'in') + '">' +
      esc(m.body) +
      '<div class="b-time">' + (m.demo ? '<span class="demo-tag">DEMO</span>' : '') + fmtTime(m.ts) + '</div>' +
    '</div>';
  }).join('');

  const html =
    '<div class="card tight" style="margin-bottom:14px;display:flex;align-items:center;gap:12px">' +
      avatarHTML(conv.name, { sm: true }) +
      '<div class="row-main">' +
        '<div class="row-title">' + esc(conv.name) + '</div>' +
        '<div class="row-sub">' + esc(conv.number) + ' · <span style="color:var(--amber)">' + esc(t('demoMode')) + '</span></div>' +
      '</div>' +
      '<button class="icon-btn" data-act="call" data-number="' + esc(conv.number) + '" data-name="' + esc(conv.name) + '">' + ic('phone', 18) + '</button>' +
    '</div>' +
    '<div class="notice" style="margin-bottom:14px">' + esc(t('demoSmsStored')) + '</div>' +
    '<div class="thread" id="thread">' + bubbles + '</div>' +
    '<div class="section"><div class="grid-2">' +
      '<button class="btn sm" data-act="device-sms" data-number="' + esc(conv.number) + '">' + ic('message', 16) + esc(t('openInMessages')) + '</button>' +
      '<button class="btn sm" data-act="copy" data-text="' + esc(conv.number) + '">' + ic('copy', 16) + esc(t('copied').split(' ')[0]) + '</button>' +
    '</div></div>' +
    '<div style="height:80px"></div>' +
    /* composer */
    '<div class="composer">' +
      '<button class="composer-mini" data-act="attach" aria-label="' + esc(t('attach')) + '">' + ic('plus', 19) + '</button>' +
      '<textarea class="input" id="composer-input" rows="1" placeholder="' + esc(t('typeMessage')) + '"></textarea>' +
      '<button class="send" data-act="send-sms" data-id="' + conv.id + '" aria-label="' + esc(t('send')) + '">' + ic('send', 18) + '</button>' +
    '</div>';

  return {
    title: conv.name,
    sub: conv.number,
    back: true,
    html: html,
    mount: function () {
      const thread = $('#thread');
      if (thread) setTimeout(function () { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 60);
      const ta = $('#composer-input');
      if (ta) {
        ta.addEventListener('input', function () {
          this.style.height = 'auto';
          this.style.height = Math.min(120, this.scrollHeight) + 'px';
        });
        ta.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendDemoSMS(conv.id, this.value);
          }
        });
      }
    }
  };
};

function sendDemoSMS(convId, body) {
  body = (body || '').trim();
  if (!body) { toast(t('typeMessage'), 'warn'); return; }
  const conv = State.conversation(convId);
  if (!conv) return;
  conv.messages.push({ id: uid('m'), dir: 'out', body: body, ts: Date.now(), demo: true });
  State.persist();
  State.addNotification('sms', 'Demo message saved', conv.name + ' · ' + body.slice(0, 40));
  Providers.sms.sendSMS(conv.number, body).then(function (r) {
    if (r && r.demo) toast(t('demoSmsStored'), 'warn');
  });
  render();
  toast(t('demoSmsStored'), 'warn');
}

/* -------------------------------------------------------- NUMBER DETAIL */
SCREENS.numberDetail = function (params) {
  const n = State.number(params.id);
  if (!n) return { title: t('numbers'), back: true, html: emptyHTML('globe', t('empty'), '') };
  const tab = params.tab || 'overview';

  const calls = State.d.calls.filter(function (c) { return c.numberId === n.id || c.number === n.number; });
  const convs = State.d.conversations.filter(function (c) { return c.number === n.number; });
  const vms = State.d.voicemails;
  const rules = State.d.rules.filter(function (r) { return r.numberId === n.id; });

  const tabs = [['overview', t('overview')], ['calls', t('calls')], ['messages', t('messages')],
                ['voicemail', t('voicemail')], ['routing', t('routing')], ['settings', t('settings')]];

  let body = '';

  if (tab === 'overview') {
    const timeline = calls.slice(0, 8).map(function (c) {
      const meta = callTypeMeta(c.type);
      return '<div class="tl-item"><div style="display:flex;align-items:center;gap:8px">' +
        '<span class="' + meta.cls + '">' + ic(meta.icon, 14) + '</span>' +
        '<span style="font-size:13.5px;font-weight:650">' + esc(c.name || c.number) + '</span>' +
        '<span style="margin-inline-start:auto;font-size:11.5px;color:var(--txt3)">' + fmtRel(c.ts) + '</span>' +
      '</div></div>';
    }).join('') || '<div style="color:var(--txt3);font-size:13px;padding:8px 0">' + esc(t('noData')) + '</div>';

    body =
      '<div class="grid-4" style="margin-bottom:16px">' +
        '<div class="stat"><span class="v">' + calls.length + '</span><span class="l">' + esc(t('calls')) + '</span></div>' +
        '<div class="stat"><span class="v">' + calls.filter(function (c) { return c.type === 'missed'; }).length + '</span><span class="l">' + esc(t('missed')) + '</span></div>' +
        '<div class="stat"><span class="v">' + convs.reduce(function (a, c) { return a + c.messages.length; }, 0) + '</span><span class="l">' + esc(t('sms')) + '</span></div>' +
        '<div class="stat"><span class="v">' + vms.length + '</span><span class="l">' + esc(t('voicemail')) + '</span></div>' +
      '</div>' +
      '<div class="section-head"><div class="section-title">' + esc(t('timeline')) + '</div></div>' +
      '<div class="card"><div class="timeline">' + timeline + '</div></div>';
  } else if (tab === 'calls') {
    body = calls.length ? '<div class="card tight">' + calls.slice(0, 20).map(function (c) {
      const meta = callTypeMeta(c.type);
      return '<div class="row">' + avatarHTML(c.name || c.number, { sm: true }) +
        '<div class="row-main"><div class="row-title">' + esc(c.name || c.number) + '</div>' +
        '<div class="row-sub">' + esc(meta.label) + (c.duration ? ' · ' + fmtDurLong(c.duration) : '') + '</div></div>' +
        '<div class="row-meta"><span class="row-time">' + fmtDate(c.ts) + '</span></div></div>';
    }).join('') + '</div>' : emptyHTML('phone', t('emptyCalls'), '');
  } else if (tab === 'messages') {
    body = convs.length ? '<div class="card tight">' + convs.map(function (c) {
      const last = c.messages[c.messages.length - 1] || { body: '', ts: Date.now() };
      return '<button class="row tappable" style="width:100%;text-align:start" data-act="nav" data-route="conversation" data-id="' + c.id + '">' +
        avatarHTML(c.name, { sm: true }) + '<div class="row-main"><div class="row-title">' + esc(c.name) + '</div>' +
        '<div class="row-sub">' + esc(last.body.slice(0, 50)) + '</div></div>' +
        '<div class="row-meta"><span class="row-time">' + fmtRel(last.ts) + '</span></div></button>';
    }).join('') + '</div>' : emptyHTML('message', t('emptyMessages'), '');
  } else if (tab === 'voicemail') {
    body = vms.length ? vms.map(function (v) { return voicemailCardHTML(v); }).join('') : emptyHTML('voicemail', t('emptyVoicemail'), '');
  } else if (tab === 'routing') {
    body = (rules.length ? rules.map(function (r) { return ruleCardHTML(r); }).join('') :
      '<div class="notice">' + esc(t('demoOnly')) + '</div>') +
      '<div style="margin-top:12px"><button class="btn full" data-act="nav" data-route="forwarding" data-number-id="' + n.id + '">' +
      ic('route', 17) + esc(t('callForwarding')) + '</button></div>';
  } else {
    body =
      '<div class="card tight">' +
        '<div class="kv"><span>' + esc(t('number')) + '</span><b>' + esc(n.number) + '</b></div>' +
        '<div class="kv"><span>' + esc(t('country')) + '</span><b>' + n.flag + ' ' + esc(t(COUNTRIES.find(function (c) { return c.code === n.country; }) ? COUNTRIES.find(function (c) { return c.code === n.country; }).key : 'countryUs')) + '</b></div>' +
        '<div class="kv"><span>' + esc(t('label')) + '</span><b>' + esc(n.label) + '</b></div>' +
        '<div class="kv"><span>' + esc(t('status')) + '</span><b>' + esc(n.status === 'active' ? t('active') : t('paused')) + '</b></div>' +
        '<div class="kv"><span>' + esc(t('voice')) + '</span><b>' + (n.voice ? '✓' : '—') + '</b></div>' +
        '<div class="kv"><span>' + esc(t('smsCapability')) + '</span><b>' + (n.sms ? '✓' : '—') + '</b></div>' +
      '</div>' +
      '<div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">' +
        '<button class="btn full" data-act="number-toggle" data-id="' + n.id + '">' + ic('bolt', 17) + esc(n.status === 'active' ? t('deactivate') : t('activate')) + '</button>' +
        '<button class="btn full danger" data-act="number-delete" data-id="' + n.id + '">' + ic('trash', 17) + esc(t('delete')) + '</button>' +
      '</div>' +
      '<div class="notice" style="margin-top:14px">' + esc(t('demoOnly')) + ' — ' + esc(t('secureBackend')) + '</div>';
  }

  const html =
    '<div class="card glow" style="margin-bottom:16px">' +
      '<div style="display:flex;align-items:center;gap:13px">' +
        '<div class="avatar lg" style="background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid var(--border2);font-size:26px">' + n.flag + '</div>' +
        '<div class="row-main">' +
          '<div style="font-size:20px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums">' + esc(n.number) + '</div>' +
          '<div style="font-size:13px;color:var(--txt3);margin-top:2px">' + esc(n.label) + '</div>' +
          '<div style="margin-top:8px"><span class="badge ' + (n.status === 'active' ? 'green' : 'amber') + '">● ' +
            esc(n.status === 'active' ? t('active') : t('paused')) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:16px">' +
        '<button class="btn primary sm" style="flex:1" data-act="call" data-number="' + esc(n.number) + '" data-name="' + esc(n.label) + '">' + ic('phone', 16) + esc(t('call')) + '</button>' +
        '<button class="btn sm" style="flex:1" data-act="new-sms" data-number="' + esc(n.number) + '">' + ic('message', 16) + esc(t('sms')) + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="tabs-inline">' +
      tabs.map(function (tb) {
        return '<button class="' + (tab === tb[0] ? 'active' : '') + '" data-act="number-tab" data-id="' + n.id + '" data-tab="' + tb[0] + '">' + esc(tb[1]) + '</button>';
      }).join('') +
    '</div>' +
    body;

  return { title: n.number, sub: n.label, back: true, html: html };
};

SCREENS.search = function () {
  const html =
    '<div class="search-wrap">' + ic('search', 18) +
      '<input class="input" id="global-search" placeholder="' + esc(t('searchPlaceholder')) + '" autocomplete="off">' +
    '</div>' +
    '<div class="notice" style="margin-bottom:16px">' + esc(t('searchHint')) + '</div>' +
    '<div id="search-results"></div>';
  return {
    title: t('search'),
    back: true,
    html: html,
    mount: function () {
      const input = $('#global-search');
      if (!input) return;
      const run = function () {
        const q = input.value.trim().toLowerCase();
        if (!q) { $('#search-results').innerHTML = ''; return; }
        $('#search-results').innerHTML = globalSearchHTML(q);
      };
      input.addEventListener('input', run);
      setTimeout(function () { input.focus(); }, 340);
    }
  };
};

function globalSearchHTML(q) {
  const d = State.d;
  const groups = [];

  const contacts = d.contacts.filter(function (c) {
    return (c.name + ' ' + c.phone + ' ' + (c.email || '') + ' ' + (c.company || '')).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 5);
  if (contacts.length) groups.push({
    title: t('contacts'),
    items: contacts.map(function (c) {
      return '<button class="row tappable" style="width:100%;text-align:start" data-act="nav" data-route="contactDetail" data-id="' + c.id + '">' +
        avatarHTML(c.name, { sm: true }) + '<div class="row-main"><div class="row-title">' + esc(c.name) + '</div>' +
        '<div class="row-sub">' + esc(c.phone) + '</div></div></button>';
    }).join('')
  });

  const calls = d.calls.filter(function (c) {
    return ((c.name || '') + ' ' + c.number).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 5);
  if (calls.length) groups.push({
    title: t('calls'),
    items: calls.map(function (c) {
      const meta = callTypeMeta(c.type);
      return '<button class="row tappable" style="width:100%;text-align:start" data-act="nav" data-route="callDetail" data-id="' + c.id + '">' +
        '<div class="call-type-ic ' + meta.cls + '" style="width:34px;height:34px;border-radius:11px;background:var(--panel2)">' + ic(meta.icon, 16) + '</div>' +
        '<div class="row-main"><div class="row-title">' + esc(c.name || c.number) + '</div>' +
        '<div class="row-sub">' + esc(meta.label) + ' · ' + fmtDate(c.ts) + '</div></div></button>';
    }).join('')
  });

  const convs = d.conversations.filter(function (c) {
    return (c.name + ' ' + c.number + ' ' + c.messages.map(function (m) { return m.body; }).join(' ')).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 5);
  if (convs.length) groups.push({
    title: t('messages'),
    items: convs.map(function (c) {
      const last = c.messages[c.messages.length - 1] || { body: '' };
      return '<button class="row tappable" style="width:100%;text-align:start" data-act="nav" data-route="conversation" data-id="' + c.id + '">' +
        avatarHTML(c.name, { sm: true }) + '<div class="row-main"><div class="row-title">' + esc(c.name) + '</div>' +
        '<div class="row-sub">' + esc(last.body.slice(0, 50)) + '</div></div></button>';
    }).join('')
  });

  const nums = d.numbers.filter(function (n) {
    return (n.number + ' ' + n.label).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 5);
  if (nums.length) groups.push({
    title: t('numbers'),
    items: nums.map(function (n) {
      return '<button class="row tappable" style="width:100%;text-align:start" data-act="nav" data-route="numberDetail" data-id="' + n.id + '">' +
        '<div class="avatar sm" style="background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid var(--border2);font-size:18px">' + n.flag + '</div>' +
        '<div class="row-main"><div class="row-title">' + esc(n.number) + '</div>' +
        '<div class="row-sub">' + esc(n.label) + '</div></div></button>';
    }).join('')
  });

  const vms = d.voicemails.filter(function (v) {
    return (v.name + ' ' + v.number).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 4);
  if (vms.length) groups.push({
    title: t('voicemail'),
    items: vms.map(function (v) {
      return '<button class="row tappable" style="width:100%;text-align:start" data-act="nav" data-route="voicemail">' +
        avatarHTML(v.name, { sm: true }) + '<div class="row-main"><div class="row-title">' + esc(v.name) + '</div>' +
        '<div class="row-sub">' + fmtDur(v.duration) + ' · ' + fmtDate(v.ts) + '</div></div></button>';
    }).join('')
  });

  const tpls = d.templates.filter(function (x) {
    return (x.name + ' ' + x.body).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 4);
  if (tpls.length) groups.push({
    title: t('templates'),
    items: tpls.map(function (x) {
      return '<button class="row tappable" style="width:100%;text-align:start" data-act="tpl-edit" data-id="' + x.id + '">' +
        '<div class="call-type-ic" style="width:34px;height:34px;border-radius:11px;background:var(--panel2);color:var(--cyan)">' + ic('file', 16) + '</div>' +
        '<div class="row-main"><div class="row-title">' + esc(x.name) + '</div>' +
        '<div class="row-sub">' + esc(x.body.slice(0, 50)) + '</div></div></button>';
    }).join('')
  });

  if (!groups.length) return emptyHTML('search', t('emptySearch'), t('searchHint'));

  return groups.map(function (g) {
    return '<div class="section" style="margin-top:0;margin-bottom:18px">' +
      '<div class="section-head"><div class="section-title">' + esc(g.title) + '</div></div>' +
      '<div class="card tight">' + g.items + '</div></div>';
  }).join('');
}

    '<div class="field"><label>' + esc(t('number')) + '</label><input class="input" id="rl-dest" value="' + esc(r.destination) + '" placeholder="+1 917 555 0142" inputmode="tel"></div>' +
    '<div class="field"><label>' + esc(t('label')) + '</label><input class="input" id="rl-label" value="' + esc(r.destinationLabel || '') + '" placeholder="My Mobile"></div>' +
