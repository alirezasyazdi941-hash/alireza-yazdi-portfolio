/* =========================================================================
   EVENT ACTIONS
   ========================================================================= */
function handleAction(act, el) {
  const d = el.dataset;

  switch (act) {
    /* ---- navigation ---- */
    case 'nav': {
      const route = d.route;
      if (d.filter) State.ui.callFilter = d.filter;
      const params = {};
      if (d.id) params.id = d.id;
      if (d.tab) params.tab = d.tab;
      if (d.numberId) params.numberId = d.numberId;
      go(route, params);
      break;
    }
    case 'tab': {
      const tab = d.tab;
      State.stack = [];
      State.route = { name: tab, params: {} };
      render();
      window.scrollTo({ top: 0 });
      break;
    }
    case 'back': {
      back();
      break;
    }
    case 'close-sheet': closeSheet(); break;

    /* ---- device integrations ---- */
    case 'tel': {
      deviceDial(d.number);
      closeSheet();
      break;
    }
    case 'call': {
      openCallSheet(d.number, d.name);
      break;
    }
    case 'demo-call': {
      closeSheet();
      setTimeout(function () { CallUI.start(d.name || d.number, d.number); }, 220);
      break;
    }
    case 'device-sms': {
      deviceSMS(d.number, '');
      break;
    }
    case 'copy': copyText(d.text || ''); break;
    case 'share': shareText(d.text || '', CONFIG.APP); break;

    /* ---- dialer ---- */
    case 'dial-key': {
      if (State.ui.dial.length >= CONFIG.MAX_DIAL) return;
      State.ui.dial += d.key;
      const disp = $('#dial-display');
      if (disp) { disp.textContent = State.ui.dial; disp.classList.add('pop'); setTimeout(function () { disp.classList.remove('pop'); }, 140); }
      const sub = $('.dial-sub');
      if (sub) sub.textContent = '';
      haptic(6);
      break;
    }
    case 'dial-back': {
      State.ui.dial = State.ui.dial.slice(0, -1);
      const disp = $('#dial-display');
      if (disp) disp.textContent = State.ui.dial;
      haptic(6);
      break;
    }
    case 'dial-call': {
      if (!State.ui.dial) { toast(t('quickDial'), 'warn'); break; }
      openCallSheet(State.ui.dial, '');
      break;
    }
    case 'dial-add-contact': {
      openContactSheet({ id: '', name: '', phone: State.ui.dial, email: '', company: '', notes: '', tags: [] });
      break;
    }

    /* ---- calls ---- */
    case 'call-filter': {
      State.ui.callFilter = d.value;
      render();
      break;
    }
    case 'delete-call': {
      confirmSheet(t('delete'), t('confirmDelete'), t('delete'), function () {
        State.deleteCall(d.id);
        toast(t('deleted'), 'ok');
        back();
      }, true);
      break;
    }
    case 'toggle-block': {
      const num = d.number;
      const i = State.d.blocked.indexOf(num);
      if (i === -1) { State.d.blocked.push(num); toast(t('blocked'), 'ok'); }
      else { State.d.blocked.splice(i, 1); toast(t('unblock'), 'ok'); }
      State.persist();
      render();
      break;
    }
    case 'add-contact-from': {
      openContactSheet({ id: '', name: d.name || '', phone: d.number || '', email: '', company: '', notes: '', tags: [] });
      break;
    }

    /* ---- contacts ---- */
    case 'contact-new': openContactSheet(null); break;
    case 'contact-edit': openContactSheet(State.contact(d.id)); break;
    case 'contact-save': {
      const name = ($('#ct-name') || {}).value || '';
      const phone = ($('#ct-phone') || {}).value || '';
      if (!name.trim() || !phone.trim()) { toast(t('name') + ' / ' + t('phone') + '?', 'warn'); break; }
      const tags = (($('#ct-tags') || {}).value || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      const payload = {
        name: name.trim(), phone: phone.trim(),
        email: (($('#ct-email') || {}).value || '').trim(),
        company: (($('#ct-company') || {}).value || '').trim(),
        notes: (($('#ct-notes') || {}).value || '').trim(),
        tags: tags
      };
      if (d.id) {
        const c = State.contact(d.id);
        if (c) Object.keys(payload).forEach(function (k) { c[k] = payload[k]; });
      } else {
        State.d.contacts.push(Object.assign({ id: uid('c') }, payload));
      }
      State.persist();
      closeSheet();
      toast(t('saved'), 'ok');
      render();
      break;
    }
    case 'contact-delete': {
      confirmSheet(t('delete'), t('confirmDelete'), t('delete'), function () {
        State.d.contacts = State.d.contacts.filter(function (c) { return c.id !== d.id; });
        State.persist();
        toast(t('deleted'), 'ok');
        back();
      }, true);
      break;
    }
    case 'contacts-export': {
      const blob = new Blob([JSON.stringify(State.d.contacts, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'nononick-contacts.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      toast(t('exported'), 'ok');
      break;
    }
    case 'contacts-import': {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'application/json,.json';
      input.addEventListener('change', function () {
        const f = input.files && input.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = function () {
          try {
            const arr = JSON.parse(reader.result);
            if (!Array.isArray(arr)) throw new Error('not array');
            arr.forEach(function (c) {
              if (c && c.name && c.phone) {
                State.d.contacts.push({ id: uid('c'), name: String(c.name), phone: String(c.phone), email: c.email || '', company: c.company || '', notes: c.notes || '', tags: Array.isArray(c.tags) ? c.tags : [] });
              }
            });
            State.persist();
            toast(t('importedOk'), 'ok');
            render();
          } catch (e) { toast(t('importFailed'), 'err'); }
        };
        reader.readAsText(f);
      });
      input.click();
      break;
    }

    /* ---- messages ---- */
    case 'new-sms': {
      if (d.number) openNewMessageSheet(d.number);
      else openNewMessageSheet('');
      break;
    }
    case 'new-sms-go': {
      const to = ($('#nm-to') || {}).value || '';
      closeSheet();
      setTimeout(function () { go('composer', { to: to }); }, 220);
      break;
    }
    case 'sms-to': {
      const conv = State.d.conversations.find(function (c) { return c.number === d.number; });
      if (conv) go('conversation', { id: conv.id });
      else go('composer', { to: d.number });
      break;
    }
    case 'send-sms': {
      const ta = $('#composer-input');
      sendDemoSMS(d.id, ta ? ta.value : '');
      break;
    }
    case 'attach': {
      openSheet(
        '<div class="notice">' + esc(t('demoSmsStored')) + '</div>' +
        '<div style="display:flex;gap:10px;margin-top:6px">' +
          '<button class="btn full" data-act="attach-pick" data-kind="photo">' + ic('camera', 17) + esc(t('camera')) + '</button>' +
          '<button class="btn full" data-act="attach-pick" data-kind="file">' + ic('paperclip', 17) + esc(t('attach')) + '</button>' +
        '</div>' +
        '<button class="btn ghost full" data-act="close-sheet">' + esc(t('cancel')) + '</button>',
        { title: t('attach'), noFocus: true }
      );
      break;
    }
    case 'attach-pick': {
      closeSheet();
      toast('Attachments require a connected messaging provider.', 'warn');
      break;
    }

    /* ---- composer ---- */
    case 'insert-var': {
      const ta = $('#cmp-body');
      if (!ta) break;
      insertAtCursor(ta, d.var);
      ta.dispatchEvent(new Event('input'));
      break;
    }
    case 'insert-var-tpl': {
      const ta = $('#tp-body');
      if (!ta) break;
      insertAtCursor(ta, d.var);
      break;
    }
    case 'composer-send': {
      const to = ($('#cmp-to') || {}).value || '';
      const body = ($('#cmp-body') || {}).value || '';
      if (!to.trim()) { toast(t('recipient') + '?', 'warn'); break; }
      if (!body.trim()) { toast(t('messageBody') + '?', 'warn'); break; }
      // find or create conversation
      let conv = State.d.conversations.find(function (c) { return c.number.replace(/\s/g, '') === to.replace(/\s/g, ''); });
      if (!conv) {
        conv = { id: uid('conv'), contactId: null, name: to, number: to, unread: 0, messages: [] };
        State.d.conversations.push(conv);
      }
      conv.messages.push({ id: uid('m'), dir: 'out', body: body, ts: Date.now(), demo: true });
      State.persist();
      toast(t('demoSmsStored'), 'warn');
      go('conversation', { id: conv.id });
      break;
    }
    case 'composer-device': {
      const to = ($('#cmp-to') || {}).value || '';
      const body = ($('#cmp-body') || {}).value || '';
      if (!to.trim()) { toast(t('recipient') + '?', 'warn'); break; }
      deviceSMS(to, body);
      break;
    }

    /* ---- numbers ---- */
    case 'number-add': openAddNumberSheet(); break;
    case 'number-search-avail': {
      const country = ($('#add-country') || {}).value || 'US';
      const listEl = $('#avail-list');
      if (!listEl) break;
      listEl.innerHTML = skeletonList(3);
      Providers.numbers.searchNumbers(country).then(function (nums) {
        listEl.innerHTML = nums.map(function (n) {
          return '<div class="card tight" style="margin-bottom:8px">' +
            '<div style="display:flex;align-items:center;gap:10px">' +
              '<div class="row-main"><div style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums">' + esc(n) + '</div>' +
              '<div style="font-size:11.5px;color:var(--txt3)">' + esc(t('demoOnly')) + '</div></div>' +
              '<button class="btn sm" data-act="number-claim" data-number="' + esc(n) + '">' + esc(t('add')) + '</button>' +
            '</div></div>';
        }).join('');
      });
      break;
    }
    case 'number-claim': {
      toast('Number provisioning requires a connected provider.', 'warn');
      openProviderSheet();
      break;
    }
    case 'number-toggle': {
      const n = State.number(d.id);
      if (!n) break;
      n.status = n.status === 'active' ? 'paused' : 'active';
      State.persist();
      toast(t('saved'), 'ok');
      render();
      break;
    }
    case 'number-delete': {
      confirmSheet(t('delete'), t('confirmDelete'), t('delete'), function () {
        State.d.numbers = State.d.numbers.filter(function (n) { return n.id !== d.id; });
        State.persist();
        toast(t('deleted'), 'ok');
        back();
      }, true);
      break;
    }
    case 'number-tab': {
      State.route = { name: 'numberDetail', params: { id: d.id, tab: d.tab } };
      render();
      break;
    }
    case 'provider-connect': openProviderSheet(); break;

    /* ---- voicemail ---- */
    case 'vm-play': {
      const v = State.d.voicemails.find(function (x) { return x.id === d.id; });
      if (v) { v.read = true; State.persist(); }
      toast(t('noRecording'), 'warn');
      render();
      break;
    }
    case 'vm-download': {
      toast(t('noRecording'), 'warn');
      break;
    }
    case 'vm-delete': {
      confirmSheet(t('delete'), t('confirmDelete'), t('delete'), function () {
        State.d.voicemails = State.d.voicemails.filter(function (x) { return x.id !== d.id; });
        State.persist();
        toast(t('deleted'), 'ok');
        render();
      }, true);
      break;
    }

    /* ---- rules ---- */
    case 'rule-new': openRuleSheet(null, d.numberId); break;
    case 'rule-edit': openRuleSheet(State.d.rules.find(function (r) { return r.id === d.id; })); break;
    case 'rule-toggle': {
      const r = State.d.rules.find(function (x) { return x.id === d.id; });
      if (!r) break;
      r.enabled = !r.enabled;
      State.persist();
      State.addNotification('routing', 'Forwarding rule updated', r.destinationLabel + ' ' + (r.enabled ? t('ruleEnabled') : t('ruleDisabled')));
      render();
      break;
    }
    case 'rule-save': {
      const payload = {
        numberId: ($('#rl-number') || {}).value || '',
        type: ($('#rl-type') || {}).value || 'always',
        destinationType: ($('#rl-dest-type') || {}).value || 'mobile',
        destination: (($('#rl-dest') || {}).value || '').trim(),
        destinationLabel: (($('#rl-label') || {}).value || '').trim()
      };
      if (!payload.destination) { toast(t('destination') + '?', 'warn'); break; }
      if (d.id) {
        const r = State.d.rules.find(function (x) { return x.id === d.id; });
        if (r) Object.keys(payload).forEach(function (k) { r[k] = payload[k]; });
      } else {
        State.d.rules.push(Object.assign({ id: uid('r'), enabled: true }, payload));
      }
      State.persist();
      closeSheet();
      toast(t('saved'), 'ok');
      State.addNotification('routing', 'Forwarding rule updated', payload.destinationLabel || payload.destination);
      render();
      break;
    }
    case 'rule-delete': {
      confirmSheet(t('delete'), t('confirmDelete'), t('delete'), function () {
        State.d.rules = State.d.rules.filter(function (r) { return r.id !== d.id; });
        State.persist();
        toast(t('deleted'), 'ok');
        render();
      }, true);
      break;
    }

    /* ---- IVR ---- */
    case 'ivr-toggle': {
      const m = State.d.ivr[0];
      if (m) { m.enabled = !m.enabled; State.persist(); render(); }
      break;
    }
    case 'ivr-remove': {
      const m = State.d.ivr[0];
      if (m) { m.options.splice(parseInt(d.index, 10), 1); State.persist(); render(); }
      break;
    }
    case 'ivr-add': {
      openSheet(
        '<div class="field"><label>Key</label><input class="input" id="iv-key" maxlength="1" placeholder="4"></div>' +
        '<div class="field"><label>' + esc(t('label')) + '</label><input class="input" id="iv-label" placeholder="Billing"></div>' +
        '<div class="field"><label>' + esc(t('destination')) + '</label><input class="input" id="iv-dest" placeholder="+1 212 555 0198"></div>' +
        '<button class="btn primary full" data-act="ivr-add-save">' + ic('check', 17) + esc(t('add')) + '</button>',
        { title: t('addOption') }
      );
      break;
    }
    case 'ivr-add-save': {
      const key = (($('#iv-key') || {}).value || '').trim() || String(State.d.ivr[0].options.length + 1);
      const label = (($('#iv-label') || {}).value || '').trim() || 'Option ' + key;
      const dest = (($('#iv-dest') || {}).value || '').trim() || 'voicemail';
      if (State.d.ivr[0]) {
        State.d.ivr[0].options.push({ key: key, label: label, dest: dest });
        State.persist();
      }
      closeSheet();
      toast(t('saved'), 'ok');
      render();
      break;
    }
    case 'ivr-greeting': {
      const m = State.d.ivr[0];
      openSheet(
        '<div class="field"><label>' + esc(t('greeting')) + '</label><textarea class="input" id="iv-greet">' + esc(m ? m.greeting : '') + '</textarea></div>' +
        '<button class="btn primary full" data-act="ivr-greet-save">' + ic('check', 17) + esc(t('save')) + '</button>',
        { title: t('greeting') }
      );
      break;
    }
    case 'ivr-greet-save': {
      const v = ($('#iv-greet') || {}).value || '';
      if (State.d.ivr[0]) { State.d.ivr[0].greeting = v; State.persist(); }
      closeSheet();
      toast(t('saved'), 'ok');
      render();
      break;
    }

    /* ---- automation ---- */
    case 'auto-new': openAutomationSheet(null); break;
    case 'auto-edit': openAutomationSheet(State.d.automations.find(function (a) { return a.id === d.id; })); break;
    case 'auto-toggle': {
      const a = State.d.automations.find(function (x) { return x.id === d.id; });
      if (!a) break;
      a.enabled = !a.enabled;
      State.persist();
      render();
      break;
    }
    case 'auto-save': {
      const trigger = ($('#au-trigger') || {}).value;
      const action = ($('#au-action') || {}).value;
      const label = (($('#au-label') || {}).value || '').trim();
      const trigLabel = (TRIGGERS.find(function (x) { return x[0] === trigger; }) || ['', trigger])[1];
      const actLabel = (ACTIONS.find(function (x) { return x[0] === action; }) || ['', action])[1];
      const payload = { trigger: trigger, action: action, label: label || (trigLabel + ' → ' + actLabel) };
      if (d.id) {
        const a = State.d.automations.find(function (x) { return x.id === d.id; });
        if (a) Object.assign(a, payload);
      } else {
        State.d.automations.push(Object.assign({ id: uid('a'), enabled: true }, payload));
      }
      State.persist();
      closeSheet();
      toast(t('saved'), 'ok');
      render();
      break;
    }
    case 'auto-delete': {
      confirmSheet(t('delete'), t('confirmDelete'), t('delete'), function () {
        State.d.automations = State.d.automations.filter(function (a) { return a.id !== d.id; });
        State.persist();
        toast(t('deleted'), 'ok');
        render();
      }, true);
      break;
    }

    /* ---- templates ---- */
    case 'tpl-new': openTemplateSheet(null); break;
    case 'tpl-edit': openTemplateSheet(State.template(d.id)); break;
    case 'tpl-fav': {
      const x = State.template(d.id);
      if (x) { x.favorite = !x.favorite; State.persist(); render(); }
      break;
    }
    case 'tpl-dup': {
      const x = State.template(d.id);
      if (x) {
        State.d.templates.push({ id: uid('t'), name: x.name + ' (copy)', body: x.body, favorite: false });
        State.persist();
        toast(t('saved'), 'ok');
        render();
      }
      break;
    }
    case 'tpl-delete': {
      confirmSheet(t('delete'), t('confirmDelete'), t('delete'), function () {
        State.d.templates = State.d.templates.filter(function (x) { return x.id !== d.id; });
        State.persist();
        toast(t('deleted'), 'ok');
        render();
      }, true);
      break;
    }
    case 'tpl-save': {
      const name = (($('#tp-name') || {}).value || '').trim();
      const body = ($('#tp-body') || {}).value || '';
      if (!name) { toast(t('templateName') + '?', 'warn'); break; }
      if (d.id) {
        const x = State.template(d.id);
        if (x) { x.name = name; x.body = body; }
      } else {
        State.d.templates.push({ id: uid('t'), name: name, body: body, favorite: false });
      }
      State.persist();
      closeSheet();
      toast(t('saved'), 'ok');
      State.addNotification('template', 'Template saved', name);
      render();
      break;
    }
    case 'tpl-use': {
      const x = State.template(d.id);
      closeSheet();
      setTimeout(function () { go('composer', { to: '' }); }, 200);
      setTimeout(function () {
        const ta = $('#cmp-body');
        const sel = $('#cmp-template');
        if (x && ta) { ta.value = x.body; ta.dispatchEvent(new Event('input')); }
        if (x && sel) sel.value = x.id;
      }, 420);
      break;
    }

    /* ---- notifications ---- */
    case 'notif-read-all': {
      State.d.notifications.forEach(function (n) { n.read = true; });
      State.persist();
      render();
      break;
    }
    case 'notif-clear': {
      State.d.notifications = [];
      State.persist();
      render();
      break;
    }
    case 'notif-open': {
      const n = State.d.notifications.find(function (x) { return x.id === d.id; });
      if (n) { n.read = true; State.persist(); }
      render();
      break;
    }

    /* ---- settings ---- */
    case 'set-theme': {
      State.d.settings.theme = d.value;
      applyTheme();
      State.persist();
      render();
      break;
    }
    case 'set-lang': {
      State.d.settings.lang = d.value;
      LANG = d.value;
      applyLang();
      State.persist();
      render();
      break;
    }
    case 'notify-toggle': {
      const key = d.key;
      State.d.settings.notify[key] = !State.d.settings.notify[key];
      State.persist();
      render();
      break;
    }
    case 'profile-edit': openProfileSheet(); break;
    case 'profile-save': {
      State.d.settings.profile.name = (($('#pf-name') || {}).value || '').trim() || State.d.settings.profile.name;
      State.d.settings.profile.email = (($('#pf-email') || {}).value || '').trim();
      State.d.settings.profile.company = (($('#pf-company') || {}).value || '').trim();
      State.persist();
      closeSheet();
      toast(t('saved'), 'ok');
      render();
      break;
    }
    case 'export-data': exportData(); break;
    case 'import-data': importData(); break;
    case 'reset-data': {
      confirmSheet(t('confirmReset'), t('confirmResetBody'), t('resetDemo'), function () {
        State.reset();
        applyTheme(); applyLang();
        State.stack = [];
        State.route = { name: 'home', params: {} };
        render();
        toast(t('resetDone'), 'ok');
      }, true);
      break;
    }

    default: break;
  }
}

/* ---------- helpers used by actions ---------- */
function insertAtCursor(el, text) {
  const start = el.selectionStart || 0;
  const end = el.selectionEnd || 0;
  const val = el.value;
  el.value = val.slice(0, start) + text + val.slice(end);
  el.selectionStart = el.selectionEnd = start + text.length;
  try { el.focus(); } catch (e) {}
}

function exportData() {
  try {
    const blob = new Blob([JSON.stringify(State.d, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nononick-global-voice-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    toast(t('exported'), 'ok');
  } catch (e) {
    toast('Export failed', 'err');
  }
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.addEventListener('change', function () {
    const f = input.files && input.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || typeof obj !== 'object' || !Array.isArray(obj.numbers)) throw new Error('invalid');
        State.d = obj;
        LANG = (obj.settings && obj.settings.lang) || 'en';
        State.persist();
        applyTheme(); applyLang();
        State.stack = [];
        State.route = { name: 'home', params: {} };
        render();
        toast(t('importedOk'), 'ok');
      } catch (e) {
        toast(t('importFailed'), 'err');
      }
    };
    reader.readAsText(f);
  });
  input.click();
}

/* =========================================================================
   THEME / LANG / TOPBAR / TABS
   ========================================================================= */
function applyTheme() {
  const th = State.d.settings.theme;
  let resolved = th;
  if (th === 'system') {
    resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', resolved);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', resolved === 'light' ? '#f2f5fb' : '#05070c');
}

function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'fa' ? 'rtl' : 'ltr';
}

/* =========================================================================
   ROUTER
   ========================================================================= */
const TAB_ROUTES = {
  home: 'home', calls: 'calls', callDetail: 'calls', dialer: 'calls',
  messages: 'messages', conversation: 'messages', composer: 'messages',
  contacts: 'contacts', contactDetail: 'contacts'
};

function go(name, params) {
  State.stack.push({ name: State.route.name, params: State.route.params });
  State.route = { name: name, params: params || {} };
  render();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function back() {
  const prev = State.stack.pop();
  State.route = prev || { name: 'home', params: {} };
  render();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* =========================================================================
   RENDER LOOP
   ========================================================================= */
function render() {
  const route = State.route;
  const screen = (SCREENS[route.name] || SCREENS.home)(route.params || {});

  /* --- topbar --- */
  const unread = State.notificationCount();
  const rightHTML =
    (screen.right || '') +
    (route.name === 'search'
      ? ''
      : '<button class="icon-btn" data-act="nav" data-route="search" aria-label="' + esc(t('search')) + '">' + ic('search', 19) + '</button>') +
    (route.name === 'notifications'
      ? ''
      : '<button class="icon-btn badge" data-act="nav" data-route="notifications" data-count="' + (unread || '') + '" aria-label="' + esc(t('notifications')) + '">' + ic('bell', 19) + '</button>');

  $('#topbar').innerHTML =
    (screen.back ? '<button class="icon-btn" data-act="back" aria-label="' + esc(t('close')) + '">' + ic('back', 20) + '</button>' : '') +
    '<div class="tb-main"><div class="tb-title">' + esc(screen.title || CONFIG.SHORT) + '</div>' +
    (screen.sub ? '<div class="tb-sub">' + esc(screen.sub) + '</div>' : '') + '</div>' +
    rightHTML;

  /* --- view --- */
  const view = $('#view');
  view.innerHTML = screen.html;

  /* --- tabbar --- */
  const activeTab = TAB_ROUTES[route.name] || 'more';
  const tabs = [['home', 'home', t('home')], ['calls', 'phone', t('calls')], ['messages', 'message', t('messages')],
                ['contacts', 'users', t('contacts')], ['more', 'grid', t('more')]];
  const unreadMsgs = State.unreadCount();
  $('#tabbar').innerHTML = '<div class="tabs">' + tabs.map(function (tb) {
    const isActive = activeTab === tb[0];
    const showDot = tb[0] === 'messages' && unreadMsgs > 0;
    return '<button class="tab ' + (isActive ? 'active' : '') + '" data-act="tab" data-tab="' + tb[0] + '" style="position:relative">' +
      '<span class="tab-ic">' + ic(tb[1], 22) + '</span>' +
      '<span>' + esc(tb[2]) + '</span>' +
      (showDot ? '<span class="tab-dot"></span>' : '') +
    '</button>';
  }).join('') + '</div>';

  /* --- FAB --- */
  const fab = $('#fab');
  const hideFab = ['dialer', 'conversation', 'composer'].indexOf(route.name) !== -1;
  fab.classList.toggle('hidden', hideFab);
  fab.innerHTML = ic(route.name === 'calls' ? 'dial' : 'plus', 26);
  fab.dataset.act = route.name === 'calls' ? 'nav' : 'fab-main';
  fab.dataset.route = route.name === 'calls' ? 'dialer' : '';

  /* --- mount hook --- */
  if (typeof screen.mount === 'function') {
    try { screen.mount(); } catch (e) { console.warn('[mount]', e); }
  }
}

/* =========================================================================
   GLOBAL EVENT DELEGATION
   ========================================================================= */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (!act) return;

  if (act === 'fab-main') {
    openSheet(
      '<button class="btn primary full" data-act="fab-call">' + ic('dial', 18) + esc(t('call')) + '</button>' +
      '<button class="btn full" data-act="new-sms">' + ic('message', 18) + esc(t('newMessage')) + '</button>' +
      '<button class="btn full" data-act="contact-new">' + ic('user', 18) + esc(t('newContact')) + '</button>' +
      '<button class="btn full" data-act="number-add">' + ic('globe', 18) + esc(t('addVirtualNumber')) + '</button>' +
      '<button class="btn full" data-act="rule-new">' + ic('route', 18) + esc(t('newRule')) + '</button>',
      { title: t('quickActions'), noFocus: true }
    );
    return;
  }
  if (act === 'fab-call') {
    closeSheet();
    setTimeout(function () { go('dialer', {}); }, 220);
    return;
  }
  if (act === 'btn-close-sheet') { closeSheet(); return; }

  handleAction(act, el);
});

/* Escape closes sheets */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && sheetOpen) closeSheet();
});

/* Call overlay controls */
$('#co-end').addEventListener('click', function () { CallUI.end(); });
$('#co-mute').addEventListener('click', function () { CallUI.toggleMute(); });
$('#co-keypad').addEventListener('click', function () { CallUI.keypad(); });
$('#co-end').innerHTML = ic('phone', 26);
$('#co-mute').innerHTML = ic('mic', 24);
$('#co-keypad').innerHTML = ic('keypad', 24);

/* System theme change */
if (window.matchMedia) {
  try {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {
      if (State.d && State.d.settings.theme === 'system') applyTheme();
    });
  } catch (e) { /* older browsers */ }
}

/* Prevent double-tap zoom on iOS for controls */
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

/* =========================================================================
   INIT
   ========================================================================= */
(function init() {
  State.init();
  applyTheme();
  applyLang();
  State.route = { name: 'home', params: {} };
  render();

  // First-run greeting (in-app only, honest about demo state)
  setTimeout(function () {
    toast(t('demoMode') + ' — ' + t('noProvider'), 'info');
  }, 700);

  console.log(
    '%c' + CONFIG.APP + ' v' + CONFIG.VERSION,
    'background:linear-gradient(90deg,#22d3ee,#a855f7);color:#04141c;padding:4px 10px;border-radius:6px;font-weight:800'
  );
  console.log('Mode: DEMO (no telephony provider connected). Providers: DemoTelephonyProvider, DemoSMSProvider, DemoNumberProvider, DemoVoicemailProvider.');
})();
</script>
