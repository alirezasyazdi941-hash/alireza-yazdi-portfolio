/* --- Send request --- */
async function doSend(){
  const btn = $('#send-btn');
  if(btn){ btn.classList.add('sending'); btn.textContent = '…'; }

  // Build URL with params
  const base = State.request.url;
  const url = HTTP.buildURL(base, State.request.params);

  // Merge auth
  const headers = Object.assign({}, State.request.headers);
  const auth = State.request.auth;
  if(auth.type === 'bearer' && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
  else if(auth.type === 'basic' && (auth.username || auth.password)) headers['Authorization'] = 'Basic ' + btoa(auth.username + ':' + auth.password);
  else if((auth.type === 'apikey' || auth.type === 'custom') && auth.key) headers[auth.key] = auth.value;

  const req = {
    method: State.request.method,
    url: url,
    headers: headers,
    body: State.request.body,
    bodyType: State.request.bodyType,
    timeoutMs: State.request.timeoutMs,
    retries: State.request.retries,
    retryDelayMs: State.request.retryDelayMs
  };

  const resp = await HTTP.request(req);
  State.response = resp;

  History.add({
    method: req.method,
    url: req.url,
    status: resp.status || 0,
    timeMs: resp.timeMs
  });

  if(btn){ btn.classList.remove('sending'); btn.textContent = 'Send'; }
  renderAll();
  if(resp.ok) toast(resp.status + ' ' + resp.statusText + ' · ' + ms(resp.timeMs), 'ok');
  else if(resp.error) toast(resp.error, 'err');
  else toast('HTTP ' + resp.status, 'warn');
}

/* --- Patch --- */
async function patchFetch(){
  const url = ($('#patch-url')||{}).value;
  if(!isURL(url)){ toast('Invalid URL','err'); return; }
  const r = await HTTP.request({ method:'GET', url, timeoutMs: 20000 });
  if(!r.ok){ toast('Fetch failed: ' + (r.error || r.status),'err'); return; }
  const pretty = prettyJSON(r.body);
  $('#patch-current').value = pretty;
  $('#patch-target').value = pretty;
  toast('Resource fetched','ok');
}

function patchPreview(){
  const a = safeJSON(($('#patch-current')||{}).value, null);
  const b = safeJSON(($('#patch-target')||{}).value, null);
  const box = $('#patch-diff');
  if(a === null || b === null){ box.innerHTML = '<div class="notice err">Both sides must be valid JSON.</div>'; return; }
  const ops = Patch.diff(a, b);
  box.innerHTML = Patch.renderDiff(ops) || '<div class="muted tiny">No changes.</div>';
}

async function patchSend(){
  const a = safeJSON(($('#patch-current')||{}).value, null);
  const b = safeJSON(($('#patch-target')||{}).value, null);
  if(a === null || b === null){ toast('Need valid JSON','err'); return; }
  const url = ($('#patch-url')||{}).value || State.request.url;
  const ops = Patch.diff(a, b);
  if(!ops.length){ toast('No changes to send','warn'); return; }

  confirmSheet('Send PATCH?',
    'About to send ' + ops.length + ' patch operation(s) to ' + url + '. This will modify the remote resource.',
    async ()=>{
      const r = await HTTP.request({
        method:'PATCH',
        url,
        headers: Object.assign({ 'Content-Type': 'application/json-patch+json' }, State.request.headers),
        body: prettyJSON(ops),
        bodyType: 'json',
        timeoutMs: 20000
      });
      const box = $('#patch-result');
      if(r.ok){
        // Verify
        const verify = await HTTP.request({ method:'GET', url, timeoutMs: 15000 });
        const verifyOps = (verify.ok && verify.body) ? Patch.diff(b, verify.body) : null;
        const verified = verifyOps && verifyOps.length === 0;
        box.innerHTML =
          '<div class="notice '+(verified?'ok':'warn')+'">'+
          '<b>PATCH '+(r.ok?'succeeded':'response')+'</b><br>'+
          'Status: '+r.status+' · '+ms(r.timeMs)+'<br>'+
          (verified ? 'Verified: remote state now matches target.' : 'Verification: remote state differs from target. Manual review recommended.')+
          '</div>'+
          '<div class="section-head" style="margin-top:10px"><div class="section-title">Verification diff</div></div>'+
          (verifyOps ? Patch.renderDiff(verifyOps) : '<div class="muted tiny">No verification data.</div>');
      } else {
        box.innerHTML = '<div class="notice err"><b>PATCH failed</b><br>'+esc(r.error || 'HTTP '+r.status)+'</div>';
      }
    },
    'Send PATCH',
    false
  );
}

/* --- Discover --- */
function renderDiscoverResult(res){
  const box = $('#discover-result');
  if(!res){ box.innerHTML = '<div class="notice err">Could not parse input.</div>'; return; }
  if(res.type === 'curl'){
    box.innerHTML = `
      <div class="card">
        <div class="section-title" style="margin-bottom:8px">Detected: cURL request</div>
        <div class="kv"><span>Method</span><b>${esc(res.data.method)}</b></div>
        <div class="kv"><span>URL</span><b>${esc(res.data.url)}</b></div>
        <div class="kv"><span>Headers</span><b>${Object.keys(res.data.headers).length}</b></div>
        <button class="btn primary full section" data-act="discover-apply-curl">Load into request builder</button>
      </div>`;
    // Bind apply
    const btn = $('[data-act="discover-apply-curl"]');
    if(btn) btn.addEventListener('click', ()=>{
      State.request.method = res.data.method;
      State.request.url = res.data.url;
      State.request.headers = res.data.headers;
      if(res.data.body) State.request.body = res.data.body;
      State.screen = 'api';
      renderAll();
      toast('Loaded into request builder','ok');
    });
  } else if(res.type === 'openapi'){

    { name:'Server error path', req:{ method:'GET', url: url + '/trigger-500-nonrealistic-xyz', timeoutMs:15000 }, expect:{ status:[500,502,503,404,403,401] } },
    { name:'HEAD request', req:{ method:'HEAD', url, timeoutMs:15000 }, expect:{ status:[200,204,301,302] } }
  ];
  renderTestResults([]);
  toast('Loaded '+State.tests.length+' test cases','ok');

async function runTests(){
  if(!State.tests.length){ loadSampleTests(); }
  const results = [];
  const box = $('#test-result');
  if(box) box.innerHTML = '<div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div></div>';
  for(let i=0;i<State.tests.length;i++){
    const t = State.tests[i];
    const r = await HTTP.request(t.req);
    const expected = (t.expect && t.expect.status) || [];
    let status = 'FAIL';
    if(r.error && expected.indexOf(0) === -1) status = 'FAIL';
    else if(expected.indexOf(r.status) !== -1) status = 'PASS';
    else if(expected.length === 0) status = r.ok ? 'PASS' : 'FAIL';
    results.push({ name: t.name, result: r, expect: expected, status });
  }
  renderTestResults(results);
}

function renderTestResults(results){
  const box = $('#test-result');
  if(!box) return;
  if(!results.length){
    box.innerHTML = '<div class="empty">No results yet. Click "Run Tests".</div>';
    return;
  }
  const pass = results.filter(r=>r.status==='PASS').length;
  const fail = results.filter(r=>r.status==='FAIL').length;
  box.innerHTML = `
    <div class="grid3">
      <div class="card tight center"><div style="font-size:22px;font-weight:800;color:#7ef0c2">${pass}</div><div class="tiny muted">PASS</div></div>
      <div class="card tight center"><div style="font-size:22px;font-weight:800;color:#ffb0bd">${fail}</div><div class="tiny muted">FAIL</div></div>
      <div class="card tight center"><div style="font-size:22px;font-weight:800">${results.length}</div><div class="tiny muted">TOTAL</div></div>
    </div>
    <div class="section">${results.map(r=>`
      <div class="list-row">
        <span class="badge ${r.status==='PASS'?'green':'red'}">${r.status}</span>
        <div class="flex1">
          <div class="li-title">${esc(r.name)}</div>
          <div class="li-sub">HTTP ${r.result.status||'—'} · expected ${r.expect.join('/')||'any'} · ${ms(r.result.timeMs)}</div>
        </div>
      </div>`).join('')}</div>
  `;
}

function scanSecrets(text){
  const found = [];
  const patterns = [
    { type:'AWS Access Key', re: /AKIA[0-9A-Z]{16}/g },
    { type:'GitHub Token', re: /gh[pousr]_[A-Za-z0-9]{36}/g },
    { type:'Stripe Live Key', re: /sk_live_[0-9a-zA-Z]{24,}/g },
    { type:'Slack Token', re: /xox[baprs]-[0-9a-zA-Z-]+/g },
    { type:'JWT', re: /eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g },
    { type:'Private Key', re: /-----BEGIN (RSA |EC |)PRIVATE KEY-----/g },
    { type:'Google API Key', re: /AIza[0-9A-Za-z_-]{35}/g }
  ];
  patterns.forEach(p=>{
    let m;
    const re = new RegExp(p.re.source, 'g');
    while((m = re.exec(text))){
      found.push({ type: p.type, match: m[0] });
      if(found.length > 20) break;
    }
  });
  return found;
}

/* --- PHP Bridge --- */
function generatePHPBridge(){
  const php = `<?php
// api-bridge.php — optional PHP adapter for NONONICK API FORGE
// Provides safe server-side fetch with SSRF protection.
// Deploy as a single file, set FORGE_TOKEN env or edit below.

declare(strict_types=1);
header('Content-Type: application/json');

// --- CONFIG ---
$SHARED_TOKEN = getenv('FORGE_TOKEN') ?: 'change-this-token';
$ALLOWED_HOSTS = ['api.example.com', 'jsonplaceholder.typicode.com'];
$ALLOW_PRIVATE = false;
$TIMEOUT = 20;

// --- AUTH ---
$hdr = getallheaders();
$token = $hdr['X-Forge-Token'] ?? '';
if(!hash_equals($SHARED_TOKEN, $token)){
    http_response_code(401);
    echo json_encode(['error' => 'unauthorized']);
    exit;
}

// --- INPUT ---
$raw = file_get_contents('php://input');
$req = json_decode($raw, true);
if(!is_array($req) || empty($req['url'])){
    http_response_code(400);
    echo json_encode(['error' => 'invalid request']);
    exit;
}

// --- SSRF PROTECTION ---
$url = $req['url'];
$parts = parse_url($url);
if(!$parts || !in_array($parts['scheme'] ?? '', ['http','https'], true)){
    http_response_code(400);
    echo json_encode(['error' => 'scheme not allowed']);
    exit;
}
$host = $parts['host'] ?? '';
if(!$host){
    http_response_code(400);
    echo json_encode(['error' => 'missing host']);
    exit;
}
// Block private networks unless explicitly allowed
$ips = gethostbynamel($host) ?: [];
foreach($ips as $ip){
    if(!$ALLOW_PRIVATE && (
        filter_var($ip, FILTER_VALIDATE_IP, FILTER_FLAG_NO_PRIV_RANGE | FILTER_FLAG_NO_RES_RANGE) === false
    )){
        http_response_code(403);
        echo json_encode(['error' => 'destination blocked (private range)']);
        exit;
    }
}
// Destination allowlist (optional — uncomment to enforce)
if(!empty($ALLOWED_HOSTS) && !in_array($host, $ALLOWED_HOSTS, true)){
    http_response_code(403);
    echo json_encode(['error' => 'destination not in allowlist', 'host' => $host]);
    exit;
}

// --- EXECUTE ---
$method = strtoupper($req['method'] ?? 'GET');
$allowed = ['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'];
if(!in_array($method, $allowed, true)){
    http_response_code(400);
    echo json_encode(['error' => 'method not allowed']);
    exit;
}

$ch = curl_init($url);
$headers = [];
foreach(($req['headers'] ?? []) as $k => $v){
    if(is_string($k) && is_string($v)) $headers[] = $k . ': ' . $v;
}

curl_setopt_array($ch, [
    CURLOPT_RETURNTRANSFER => true,
    CURLOPT_FOLLOWLOCATION => false, // do not auto-follow; prevents redirect SSRF
    CURLOPT_TIMEOUT        => $TIMEOUT,
    CURLOPT_CUSTOMREQUEST  => $method,
    CURLOPT_HTTPHEADER     => $headers,
    CURLOPT_SSL_VERIFYPEER => true,
    CURLOPT_SSL_VERIFYHOST => 2
]);

if(!empty($req['body']) && in_array($method, ['POST','PUT','PATCH','DELETE'], true)){
    curl_setopt($ch, CURLOPT_POSTFIELDS, $req['body']);
}

$body = curl_exec($ch);
$status = curl_getinfo($ch, CURLINFO_HTTP_CODE);
$err = curl_error($ch);
curl_close($ch);

if($body === false){
    http_response_code(502);
    echo json_encode(['error' => 'upstream failed', 'detail' => $err]);
    exit;
}

http_response_code($status ?: 502);
echo $body;
`;
  openSheet(
    '<div class="notice warn">Deploy to your server. Protect with a shared token. The adapter enforces SSRF protection.</div>'+
    '<div class="code wrap small" style="margin-top:8px">'+esc(php)+'</div>'+
    '<button class="btn primary full" style="margin-top:8px" data-act="copy-generic" data-text="'+esc(php)+'">Copy PHP</button>',
    {title:'PHP API Bridge'}
  );
}

function showSSRFNotes(){

========================

Server-side fetch adapters must protect against Server-Side Request Forgery:

1. Scheme allowlist
   ✓ Only allow http:// and https://

2. Host/IP validation
   ✗ Block RFC1918 (10/8, 172.16/12, 192.168/16)
   ✗ Block loopback (127.0.0.0/8, ::1)
   ✗ Block link-local (169.254.0.0/16, fe80::/10)
   ✗ Block cloud metadata (169.254.169.254)
   ✗ Block IPv6 ULA (fc00::/7)

3. Resolve then validate
   Resolve hostname to IP first, THEN check the IP.

4. Redirect handling
   Disable auto-redirects. Validate each hop.
   Or set a maximum of 1–2 hops with re-validation.

5. Destination allowlist
   For internal APIs, only permit known hosts.

6. Timeouts

7. Response size cap
   Limit body size to prevent memory exhaustion.

8. Logging

9. Secrets

document.addEventListener('keydown', function(e){
  // Cmd/Ctrl+K
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    if($('#palette').classList.contains('open')) closePalette();
    else openPalette();
    return;
  }
  // Cmd/Ctrl+Enter to send
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    if(State.screen === 'api' || State.screen === 'fetch'){
      e.preventDefault();
      doSend();
    }
  }
  // Escape closes palette
  if(e.key === 'Escape'){
    if($('#palette').classList.contains('open')) closePalette();
    else if(sheetOpen) closeSheet();
  }
  // Palette navigation
  if($('#palette').classList.contains('open')){
    const items = $$('.palette-item');
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      paletteActiveIdx = Math.min(items.length - 1, paletteActiveIdx + 1);
      updatePaletteActive(items);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      paletteActiveIdx = Math.max(0, paletteActiveIdx - 1);
      updatePaletteActive(items);
    } else if(e.key === 'Enter'){
      e.preventDefault();
      const active = items[paletteActiveIdx];
      if(active) active.click();
    }
  }
});

function updatePaletteActive(items){
  items.forEach((el,i)=>el.classList.toggle('active', i === paletteActiveIdx));
  const act = items[paletteActiveIdx];
  if(act) act.scrollIntoView({block:'nearest'});
}

document.addEventListener('input', function(e){

  if(t.dataset.pk !== undefined){
    const i = parseInt(t.dataset.pk,10);
    if(State.request.params[i]) State.request.params[i].key = t.value;
  }
  if(t.dataset.pv !== undefined){
    const i = parseInt(t.dataset.pv,10);
    if(State.request.params[i]) State.request.params[i].value = t.value;
  }
  if(t.hasAttribute('data-hdr-key')){
    const row = t.closest('[data-hk]');
    if(!row) return;
    const oldKey = row.dataset.hk;
    const val = row.querySelector('[data-hdr-val]').value;
    if(oldKey !== t.value && t.value){
      delete State.request.headers[oldKey];
      State.request.headers[t.value] = val;
      row.dataset.hk = t.value;
    } else if(oldKey === t.value){
      // no-op
    }
  }
  if(t.hasAttribute('data-hdr-val')){
    const row = t.closest('[data-hk]');
    if(!row) return;
    const key = row.dataset.hk;
    if(key) State.request.headers[key] = t.value;
  }
  if(t.id === 'body-input'){
    State.request.body = t.value;
  }
  if(t.id === 'req-url'){
    State.request.url = t.value;
  }
  if(t.id === 'auth-token'){ State.request.auth.token = t.value; }
  if(t.id === 'auth-user'){ State.request.auth.username = t.value; }
  if(t.id === 'auth-pass'){ State.request.auth.password = t.value; }
  if(t.id === 'auth-key'){ State.request.auth.key = t.value; }
  if(t.id === 'auth-value'){ State.request.auth.value = t.value; }
  if(t.id === 'opt-timeout'){ State.request.timeoutMs = parseInt(t.value,10) || 30000; }
  if(t.id === 'opt-retries'){ State.request.retries = parseInt(t.value,10) || 0; }
  if(t.id === 'opt-delay'){ State.request.retryDelayMs = parseInt(t.value,10) || 500; }
});

document.addEventListener('change', function(e){
  const t = e.target;
  if(t.id === 'auth-type'){
    State.request.auth.type = t.value;
    renderAuthFields();
  }
  if(t.id === 'body-type'){
    State.request.bodyType = t.value;
  }
});

/* ============================================================================
   BOOT
   ============================================================================ */
(function boot(){
  // Restore persisted state
  const persistedReq = Store.get('lastRequest', null);
  if(persistedReq && persistedReq.url){
    State.request = Object.assign(State.request, persistedReq);
  }
  State.workflow = Store.get('workflow', { nodes: [] });
  State.endpoints = Store.get('endpoints', []);

  renderAll();

  // Persist request on unload
  window.addEventListener('beforeunload', ()=>{
    Store.set('lastRequest', State.request);
  });

  // Save request periodically
  setInterval(()=>Store.set('lastRequest', State.request), 30000);

  console.log('%c'+APP.name+' v'+APP.version, 'background:linear-gradient(90deg,#22d3ee,#a855f7);color:#04141c;padding:4px 10px;border-radius:6px;font-weight:800');
  console.log('Tip: press ⌘K / Ctrl+K for the command palette.');
  console.log('Tip: ⌘↵ / Ctrl+↵ sends the current request.');
})();
</script>
</body>
