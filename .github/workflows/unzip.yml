name: Unzip uploaded zips

# Upload one or more .zip files to the repo root (e.g. site.zip, apps-1.zip, apps-2.zip).
# Each is extracted and merged into the repo (later names overwrite earlier ones), then deleted,
# the result is committed and GitHub Pages is asked to rebuild.
# A zip with a single top-level folder is flattened. Anything under .github/ or .git/ is ignored.
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zips
        run: |
          shopt -s nullglob
          zips=(./*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "no zip at repo root"; exit 1; }
          for z in "${zips[@]}"; do
            echo "== $z"
            rm -rf _tmp; mkdir _tmp
            unzip -q -o "$z" -d _tmp
            find _tmp -name '__MACOSX' -prune -exec rm -rf {} + ; find _tmp -name '.DS_Store' -delete
            rm -rf _tmp/.github _tmp/.git
            n=$(ls -A _tmp | wc -l)
            if [ "$n" -eq 1 ] && [ -d "_tmp/$(ls -A _tmp)" ]; then src="_tmp/$(ls -A _tmp)"; else src=_tmp; fi
            rm -rf "$src/.github" "$src/.git"
            cp -a "$src"/. .
            rm -rf _tmp "$z"
          done

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update site from uploaded zips" || echo "nothing to commit"
          git push

      - name: Ask Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
