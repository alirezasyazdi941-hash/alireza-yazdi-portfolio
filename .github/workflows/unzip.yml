name: Unzip site.zip

# Upload one file named site.zip to the repo root; this extracts it, commits the result
# and asks GitHub Pages to rebuild. Nothing else is touched.
on:
  push:
    paths: ['site.zip']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract site.zip
        run: |
          test -f site.zip
          unzip -q -o site.zip -d _tmp
          n=$(ls -A _tmp | wc -l)
          if [ "$n" -eq 1 ] && [ -d "_tmp/$(ls -A _tmp)" ]; then src="_tmp/$(ls -A _tmp)"; else src=_tmp; fi
          cp -a "$src"/. .
          rm -rf _tmp site.zip

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update site from site.zip" || echo "nothing to commit"
          git push

      - name: Ask Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
